<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klub Pult</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#e9edf1;--panel:#ffffff;--panel2:#f4f6f8;--side:#f1f6fa;--line:#cdd4db;--line2:#e2e7eb;
  --text:#1a2631;--muted:#5b6874;--accent:#0a8bb0;--accent-ink:#ffffff;--accent-soft:#d3edf5;
  --sel:#d6dbe0;--hover:#edf4f8;--ok:#1d9a52;--busy:#1f6fd0;--warn:#c98200;--off:#c0322a;
  --ok-soft:#dcf3e5;--busy-soft:#dde9fb;--warn-soft:#fbefd2;--off-soft:#f8dedb;
  --tool:#f3f4f6;--tool-b:#dde1e5;--ov:rgba(14,26,38,.4);--shadow:0 14px 44px rgba(14,30,46,.24);
  --c1:#0a8bb0;--c2:#e0891c;--c3:#7a5bd6;--c4:#2f9e6a;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1317;--panel:#151c22;--panel2:#1a2229;--side:#12191e;--line:#2b353e;--line2:#212a32;
  --text:#dbe4ea;--muted:#8e9ba6;--accent:#35b5d8;--accent-ink:#06222c;--accent-soft:#123a46;
  --sel:#27323b;--hover:#1b252d;--ok:#3ccb78;--busy:#62a2ff;--warn:#f0b43c;--off:#f0645a;
  --ok-soft:#133526;--busy-soft:#172a45;--warn-soft:#3a2e12;--off-soft:#3d1a18;
  --tool:#171f25;--tool-b:#29333b;--ov:rgba(0,0,0,.55);--shadow:0 14px 44px rgba(0,0,0,.5);
  --c1:#35b5d8;--c2:#f0a040;--c3:#a08bff;--c4:#4fd08f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1317;--panel:#151c22;--panel2:#1a2229;--side:#12191e;--line:#2b353e;--line2:#212a32;
  --text:#dbe4ea;--muted:#8e9ba6;--accent:#35b5d8;--accent-ink:#06222c;--accent-soft:#123a46;
  --sel:#27323b;--hover:#1b252d;--ok:#3ccb78;--busy:#62a2ff;--warn:#f0b43c;--off:#f0645a;
  --ok-soft:#133526;--busy-soft:#172a45;--warn-soft:#3a2e12;--off-soft:#3d1a18;
  --tool:#171f25;--tool-b:#29333b;--ov:rgba(0,0,0,.55);--shadow:0 14px 44px rgba(0,0,0,.5);
  --c1:#35b5d8;--c2:#f0a040;--c3:#a08bff;--c4:#4fd08f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%}
.side{background:var(--side);border-bottom:1px solid var(--line2);display:flex;align-items:center;padding:6px 16px;gap:14px;overflow-x:auto;min-height:52px}
.brand{display:flex;flex-direction:column;flex:none;padding-right:14px;border-right:1px solid var(--line2);line-height:1.2}
.brand b{font-size:15px;letter-spacing:.02em;white-space:nowrap}
.brand span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.nav{display:flex;flex-direction:row;gap:2px}
.nav button{display:flex;align-items:center;gap:7px;padding:8px 12px;border:0;border-bottom:3px solid transparent;border-radius:8px 8px 4px 4px;background:none;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap}
.nav button:hover{background:var(--hover);color:var(--text)}
.nav button.on{background:var(--accent-soft);color:var(--text);font-weight:700;border-bottom-color:var(--accent)}
.nav button.locked{opacity:.45;cursor:not-allowed}
.nav .badge{font-size:11px;font-weight:600;color:var(--text)}
.nav .badge.red{background:var(--off);color:#fff;border-radius:99px;padding:0 6px;text-align:center}
.side-foot{margin-left:auto;display:flex;flex-direction:row;align-items:center;gap:8px;flex:none}
.me{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 5px;border:1px solid var(--line2);border-radius:99px;background:var(--panel);cursor:pointer;text-align:left;line-height:1.2;white-space:nowrap}
.me .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12px;flex:none}
.me small{display:block;color:var(--muted);font-size:11px}
.themebtn{border:1px solid var(--line2);background:var(--panel);border-radius:99px;padding:6px 12px;cursor:pointer;color:var(--muted);font-size:12.5px;white-space:nowrap}
.main{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column}

/* ---------- Zal ---------- */
.zal{display:flex;flex-direction:column;height:100%;min-height:0}
.toolbar{display:flex;align-items:stretch;gap:2px;padding:6px 8px;background:var(--tool);border-bottom:1px solid var(--tool-b);flex-wrap:wrap}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;min-width:70px;padding:5px 6px 4px;border:1px solid transparent;border-radius:4px;background:none;color:var(--text);font-size:12px;cursor:pointer;white-space:nowrap}
.tb:hover:not(:disabled){background:var(--panel);border-color:var(--tool-b)}
.tb:active:not(:disabled){transform:translateY(1px)}
.tb:disabled{opacity:.38;cursor:default}
.tb svg{width:30px;height:30px}
.tb-sep{width:1px;background:var(--tool-b);margin:4px 6px}
.ico-scr{fill:var(--panel2);stroke:var(--muted)}
.clock{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:2px;padding:0 4px}
.clock .t{font:500 22px/1 "JetBrains Mono",ui-monospace,monospace;border:1px solid var(--tool-b);background:var(--panel);padding:4px 10px;border-radius:3px;letter-spacing:.04em}
.clock .d{font-size:12px;color:var(--muted)}
.subbar{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--panel2);border-bottom:1px solid var(--line2);flex-wrap:wrap}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tabs button{border:0;background:var(--panel);padding:4px 12px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--text)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.chip b{font-weight:700}
.subbar input{margin-left:auto;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);min-width:0;width:200px}

.st{display:inline-block;width:11px;height:11px;flex:none;vertical-align:-1px}
.st-free{background:var(--ok);border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.st-busy{width:0;height:0;border-left:11px solid var(--busy);border-top:6px solid transparent;border-bottom:6px solid transparent}
.st-pause{border-left:4px solid var(--warn);border-right:4px solid var(--warn);width:11px}
.st-off{background:var(--off);border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}

.gridwrap{flex:1;min-height:120px;overflow:auto;background:var(--panel)}
table.pcs{border-collapse:collapse;min-width:100%;font-size:15px;font-variant-numeric:tabular-nums;user-select:none}
table.pcs th{position:sticky;top:0;z-index:1;background:var(--panel2);border:1px solid var(--line);text-align:left;font-weight:600;padding:4px 6px;white-space:nowrap;font-size:.9em;cursor:pointer}
table.pcs th .ar{font-size:10px;color:var(--muted)}
table.pcs td{border:1px solid var(--line2);padding:2px 6px;white-space:nowrap;height:1.75em}
table.pcs td.n{text-align:right;font-weight:600;width:1%}
table.pcs td.stc{width:1%;padding-right:4px}
table.pcs tr{cursor:default}
table.pcs tbody tr:hover td{background:var(--hover)}
table.pcs tr.sel td{background:var(--sel)}
table.pcs tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
table.pcs td.neg{color:var(--off)}
table.pcs td.low{color:var(--off);font-weight:600}
table.pcs tr.s-off td{color:var(--muted)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding:12px;user-select:none;align-items:start}
.card{--stc:var(--ok);border:1px solid var(--line);border-top:4px solid var(--stc);border-radius:8px;background:var(--panel);padding:9px 10px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:112px}
.card:hover{background:var(--hover)}
.card.sel{outline:2px solid var(--accent);outline-offset:1px}
.card.s-busy{--stc:var(--busy)}.card.s-pause{--stc:var(--warn)}.card.s-off{--stc:var(--off);opacity:.72}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .pn{font-size:1.45em;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.card .ct{font-size:1.6em;font-weight:700;color:var(--warn);font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px}
.card .ct.low{color:var(--off)}
.card .ct.muted{color:var(--muted);opacity:.6}
.card .cm{font-size:.9em;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--line2)}
.card .kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:.93em;padding-top:4px}
.card .kv span{color:var(--muted);white-space:nowrap}
.card .kv b{white-space:nowrap}
.card .kv b{text-align:right;font-variant-numeric:tabular-nums}
.card .blue,table.pcs td.blue{color:var(--busy)}
.ord{display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--panel)}
.ord-r{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;border-bottom:1px solid var(--line2);color:var(--text);font-size:13.5px}
.ord-r:last-child{border-bottom:0}
.ord-r.dragging{opacity:.4}.ord-r.over{box-shadow:inset 0 2px 0 var(--accent)}
.ord-r .hd{cursor:grab;color:var(--muted);user-select:none;letter-spacing:-2px}
.ord-r label{display:flex;align-items:center;gap:8px;flex:1;cursor:pointer}
.ord-r .btn{padding:2px 8px}
.ord-r .btn+.btn{margin-left:2px}
.ord-fix{color:var(--muted);font-size:12.5px;padding:6px 10px;background:var(--panel2);border-bottom:1px solid var(--line2)}
.card .who{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tm{font:500 16px/1.2 "JetBrains Mono",ui-monospace,monospace}
.card .tm.low{color:var(--off)}
.card .sm{font-size:12.5px;font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line2);border-radius:4px;overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--stc)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.p-free{background:var(--ok-soft);color:var(--ok)}.p-busy{background:var(--busy-soft);color:var(--busy)}
.p-pause{background:var(--warn-soft);color:var(--warn)}.p-off{background:var(--off-soft);color:var(--off)}
.p-mut{background:var(--panel2);color:var(--muted);border:1px solid var(--line2)}
.p-acc{background:var(--accent-soft);color:var(--accent)}

.resize{height:7px;cursor:ns-resize;background:var(--tool);border-top:1px solid var(--line);border-bottom:1px solid var(--line2);position:relative;touch-action:none}
.resize::after{content:"";position:absolute;left:50%;top:2px;width:36px;height:2px;margin-left:-18px;border-top:1px solid var(--muted);border-bottom:1px solid var(--muted);opacity:.5}
.logp{height:220px;display:flex;flex-direction:column;background:var(--panel);min-height:80px}
.logh{display:flex;align-items:center;gap:8px;padding:4px 10px;border-bottom:1px solid var(--line2);font-size:12.5px;flex-wrap:wrap}
.logh select,.logh input{padding:2px 6px;border:1px solid var(--line);border-radius:5px;background:var(--panel2);font-size:12px}
.logh input{width:170px}
.log{flex:1;overflow:auto;font-size:12.5px;font-variant-numeric:tabular-nums}
table.lgt{border-collapse:collapse;width:100%}
table.lgt th{position:sticky;top:0;z-index:1;background:var(--panel2);border-bottom:1px solid var(--line);text-align:left;font-weight:600;font-size:11.5px;color:var(--muted);padding:4px 8px;white-space:nowrap}
table.lgt td{padding:3px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
table.lgt td.nw{white-space:nowrap;color:var(--muted)}
table.lgt td.ic{width:1%;padding-right:0}
table.lgt td.pc{white-space:nowrap;font-weight:600;text-align:right}
table.lgt tr.lg:hover td{background:var(--hover)}
table.lgt tr.lg.sel td{background:var(--accent-soft)}
table.lgt tr.lg.sel td:first-child{box-shadow:inset 3px 0 0 var(--busy)}
table.lgt .pill{font-size:11px;padding:0 7px}
.lg .li{display:block;width:15px;height:15px;margin-top:1px}
table.lgt tr.lg{cursor:default}
.lgmore{font-size:11.5px;color:var(--muted);text-align:center;padding:4px}

/* ---------- Pages ---------- */
.page{padding:20px 24px 32px;overflow:auto;height:100%;display:flex;flex-direction:column;gap:16px}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph h1{font-size:22px;margin:0 auto 0 0;text-wrap:balance}
.ph input[type=search]{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);width:220px;max-width:100%}
.box{background:var(--panel);border:1px solid var(--line2);border-radius:10px}
.box>h2{font-size:14px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
.box>h2 small{font-weight:400;color:var(--muted);margin-left:auto}
.boxb{padding:14px 16px}
.tbl{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.t th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;padding:9px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;background:var(--panel2)}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td.r,table.t th.r{text-align:right}
table.t td.act{white-space:nowrap;text-align:right}
table.t td small{display:block;color:var(--muted);font-size:12px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted);letter-spacing:.02em}
.kpi .v{font-size:19px;overflow-wrap:anywhere;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.good .v{color:var(--ok)}.kpi.bad .v{color:var(--off)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.note{font-size:12.5px;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:7px;padding:7px 12px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dng{color:var(--off);border-color:var(--off)}
.btn.sm{padding:3px 9px;font-size:12.5px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn+.btn{margin-left:4px}

.hbar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.hbar .tr{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--c1);border-radius:5px}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--panel2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
svg.chart .gl{stroke:var(--line2)}

.pl td:first-child{padding-left:28px}
.pl tr.tot td{font-weight:700;background:var(--panel2)}
.pl tr.sub td{font-weight:600}

.kpi.hl{background:var(--accent-soft);border-color:var(--accent)}
.kh table.t tr.tot td{background:var(--panel2);border-top:1px solid var(--line)}
.kpis.k7{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.kpi .v{letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rfilt{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;padding:12px 16px}
.rfilt label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.rfilt label span{display:flex;gap:6px}
.rfilt input{padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--text);font:inherit;font-size:13px}
.pchips{display:flex;gap:6px;flex-wrap:wrap;align-self:center}
.pchips button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:99px;padding:6px 14px;cursor:pointer;font-size:13px}
.pchips button.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.btn.dark{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:700;padding:9px 16px}
.ck2{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.ph h1+input[type=search]{width:260px}

/* ---------- Sozlamalar ---------- */
.set{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px;align-items:start}
.set-nav{display:flex;flex-direction:column;padding:6px;gap:1px;position:sticky;top:0}
.set-nav button{text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;color:var(--muted);cursor:pointer;font-weight:500}
.set-nav button:hover:not(:disabled){background:var(--hover);color:var(--text)}
.set-nav button.on{background:var(--accent-soft);color:var(--text);font-weight:700}
.set-nav button:disabled{opacity:.4;cursor:not-allowed}
.set-body{display:flex;flex-direction:column;gap:14px;min-width:0}
.set-body>.tabs{align-self:flex-start}
.cell-in{padding:4px 7px;border:1px solid transparent;border-radius:5px;background:transparent;width:100%;min-width:130px;font-variant-numeric:tabular-nums}
.cell-in:hover{border-color:var(--line)}
.cell-in:focus{border-color:var(--accent);background:var(--panel2)}
.cell-in.bad{border-color:var(--off);background:var(--off-soft)}
.cell-in::placeholder{color:var(--muted);font-style:italic}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line2);align-items:center}
.btnrow .btn+.btn{margin-left:0}
.perm{display:grid;grid-template-columns:1fr 70px 70px;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line2)}
.perm:last-child{border-bottom:0}
.perm small{display:block;color:var(--muted);font-size:12px}
.perm .c{text-align:center}
.perm.h{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;background:var(--panel2)}
.gsw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}

/* ---------- Sozlamalar: qoʻshimcha ---------- */
.sw{display:inline-flex;flex:none}
.sw input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}

/* =================== Seans hisob-kitobi =================== */
function elapsed(s,now=Date.now()){return Math.max(0,now-s.start-s.pausedTotal-(s.pausedAt?now-s.pausedAt:0))}
function limitMs(s){
  if(s.mode==='pre')return s.paidMin*MIN;
  if(s.mode==='balance'){const c=client(s.clientId);return c?Math.floor(c.balance/s.rate*60)*MIN:0}
  return null;
}
const barTotal=s=>s.bar.reduce((a,b)=>a+b.price*b.qty,0);
function timeCost(s,now){return r100(s.rate*Math.ceil(elapsed(s,now)/MIN)/60)}
function accrued(s,now){return (s.mode==='pre'?s.paid:timeCost(s,now))+barTotal(s)}
function creditLeft(s,now){
  if(s.mode==='pre')return s.paid-timeCost(s,now)-barTotal(s);
  if(s.mode==='balance'){const c=client(s.clientId);return (c?c.balance:0)-timeCost(s,now)-barTotal(s)}
  return -(timeCost(s,now)+barTotal(s));
}
function endAt(s,now=Date.now()){const L=limitMs(s);return L==null?null:s.start+s.pausedTotal+(s.pausedAt?now-s.pausedAt:0)+L}
function applies(t,date=new Date()){
  if(!t.active||!(t.price>0))return false;
  if(t.days&&t.days.length&&!t.days.includes(date.getDay()))return false;
  if(t.from&&t.to){
    const c=date.getHours()*60+date.getMinutes();
    const [fh,fm]=t.from.split(':').map(Number),[th,tm]=t.to.split(':').map(Number);
    const f=fh*60+fm,e=th*60+tm;
    return f<=e?(c>=f&&c<e):(c>=f||c<e);
  }
  return true;
}
function led(kind,amount,method,extra){if(amount>0)S.ledger.push(Object.assign({id:uid(),t:Date.now(),kind,amount,method},extra||{}))}
function addLog(type,text,t){S.log.push({t:t||Date.now(),type,text});if(S.log.length>3000)S.log.splice(0,S.log.length-3000);if(ui.view==='zal')renderLog('append')}

function startSession(n,o){
  const pc=pcBy(n),t=tariff(o.tariffId),now=Date.now();
  if(pc.status==='off')addLog('info',`Wake-on-LAN paketi yuborildi → PC ${n} (MAC ${pc.mac}) — vaqt ochildi`);
  pc.offAt=null;
  const rate=t.type==='hour'?t.price:Math.round(t.price/(t.minutes/60));
  const s={id:uid(),start:now,mode:o.mode,tariffId:t.id,tname:t.name,rate,clientId:o.clientId||null,guest:o.guest||'',
    pausedTotal:0,pausedAt:null,bar:[],note:o.note||'',paid:0,paidMin:0};
  if(o.mode==='pre'){
    s.paidMin=t.type==='package'?t.minutes:o.minutes;
    s.paid=t.type==='package'?t.price:o.amount;
    led('pc',s.paid,o.method,{pc:n,clientId:s.clientId});
  }
  pc.status='busy';pc.session=s;
  const L=limitMs(s);
  addLog('info',`Seans boshlandi PC ${n} >> (${dstr(now)} ${hms(now)}${L!=null?' – '+hms(now+L):''}) ${MODES[s.mode]} / ${t.name} / ${who(s)}`+
    (o.mode==='pre'?` / Toʻlandi ${som(s.paid)} (${METHODS[o.method]})`:'')+(o.mode==='balance'?` / Balans ${som(client(s.clientId).balance)}`:''));
}
function finishSession(n,method,auto){
  const pc=pcBy(n),s=pc.session,now=Date.now();
  const mins=Math.max(1,Math.ceil(elapsed(s,now)/MIN));
  let pcCost=s.mode==='pre'?s.paid:r100(s.rate*mins/60);
  const bt=barTotal(s);
  if(s.mode==='balance'){
    const c=client(s.clientId);const take=Math.min(pcCost,c?c.balance:0);
    if(c)c.balance-=take;pcCost=take;led('pc',take,'balance',{pc:n,clientId:s.clientId});
  }
  const due=(s.mode==='post'?pcCost:0)+bt;
  const m=due>0?method:'none';
  if(s.mode==='post')led('pc',pcCost,m,{pc:n,clientId:s.clientId});
  s.bar.forEach(b=>led('bar',b.price*b.qty,m,{pid:b.pid,qty:b.qty,cost:b.cost*b.qty,pc:n,clientId:s.clientId}));
  if(m==='debt')S.debts.push({id:uid(),clientId:s.clientId,name:who(s),amount:due,t:now,note:`Seans: PC ${n}`+(auto?' (vaqt tugadi, avtomatik)':'')});
  S.history.push({id:uid(),pc:n,clientId:s.clientId,start:s.start,end:now,minutes:mins,pcCost,barCost:bt,total:pcCost+bt,method:m,mode:s.mode});
  pc.status='free';pc.session=null;
  const tail=due>0?(m==='debt'?`Qarz daftariga yozildi ${som(due)}`:`Mijozdan olindi ${som(due)} (${METHODS[m]})`):'Qoʻshimcha toʻlov yoʻq';
  addLog(due>0?'warn':'info',`Seans yakunlandi PC ${n} >> ${dstr(now)} ${hms(now)} / ${s.tname} / ${who(s)} / ${som(pcCost+bt)} / ${durTxt(mins)} / ${tail}`+(auto?' / avtomatik':''));
}

function migrate(){

  if(!st.warn)st.warn={on:true,mins:[5,1],text:'Vaqtingiz {min} daqiqadan soʻng tugaydi'};
  st.ui=Object.assign({font:15,zalDefault:'table',cols:{}},st.ui||{});
  ZCOLS.forEach(c=>{if(!(c[0] in st.ui.cols))st.ui.cols[c[0]]=c[3]});
  const fixOrd=(o,list)=>{if(!o||!o.length)return list.map(x=>x[0]);o=o.filter(k=>list.some(x=>x[0]===k));list.forEach(x=>{if(!o.includes(x[0])){const i=o.indexOf('sum');x[0]==='played'&&i>=0?o.splice(i+1,0,x[0]):o.push(x[0])}});return o};
  st.ui.order=fixOrd(st.ui.order,ZCOLS);
  st.ui.crows=st.ui.crows||{};CROWS.forEach(c=>{if(!(c[0] in st.ui.crows))st.ui.crows[c[0]]=c[2]});
  st.ui.corder=fixOrd(st.ui.corder,CROWS);
  if(!S.groups||!S.groups.length)S.groups=[{id:'g1',name:'General',tariffs:[],note:'Asosiy zal',color:'#0a8bb0'}];
  S.perms=Object.assign({},DEF_PERMS,S.perms||{});
  if(!st.lock)st.lock=Object.assign({},LK_DEF);
  st.beh=Object.assign({autoWake:true,timer:false,end:'lock',offMin:5,block:true},st.beh||{});
  st.srv=Object.assign({ip:'192.168.1.50',port:7777,code:'888518',svcPass:'0000',sync:true,lastSync:null},st.srv||{});
  st.debtDisc=Object.assign({on:true,pct:25},st.debtDisc||{});
  if(!st.ui.family)st.ui.family='Onest';
  if(!S.lockByGroup)S.lockByGroup={};
  if(!S.debtPays){S.debtPays=[];S.debts.forEach(d=>{(d.pays||[]).forEach(x=>S.debtPays.push({id:uid(),key:debtKey(d),clientId:d.clientId,name:d.name,t:x.t,amount:x.amount,disc:x.disc||0,pct:x.disc&&x.amount?Math.round(x.disc/x.amount*100):0,method:x.method}));delete d.pays;delete d.paid})}
  if(st.lock&&st.lock.sPc==null)st.lock.sPc=100;
  S.pcs.forEach(p=>{if(!p.group)p.group=S.groups[0].id;if(p.ip==null)p.ip='192.168.1.'+(200+p.n);if(p.mac==null)p.mac=(p.n>44||p.n===42)?'':macFor(p.n);if(!p.inbox)p.inbox=[];if(p.paired==null)p.paired=!!p.mac});
}

/* =================== Statistika =================== */
const INFLOW=m=>m in METHODS;
function shiftStats(from,to){
  const r={m:{cash:0,card:0,click:0,payme:0},pc:0,bar:0,topup:0,debtpay:0,debt:0,total:0,sessions:0,outCash:0,outOther:0};
  for(const e of S.expenses)if(e.src==='kassa'&&e.t>=from&&e.t<to){if(e.method==='cash')r.outCash+=e.amount;else r.outOther+=e.amount}
  for(const e of S.ledger){if(e.t<from||e.t>=to)continue;
    if(INFLOW(e.method)){r.m[e.method]+=e.amount;r.total+=e.amount}
    if(e.kind==='pc')r.pc+=e.amount;else if(e.kind==='bar')r.bar+=e.amount;else if(e.kind==='topup')r.topup+=e.amount;else if(e.kind==='debtpay')r.debtpay+=e.amount;
    if(e.method==='debt')r.debt+=e.amount;}
  for(const h of S.history)if(h.end>=from&&h.end<to)r.sessions++;
  return r;
}
function spentMap(){const m={};for(const h of S.history)if(h.clientId)m[h.clientId]=(m[h.clientId]||0)+h.total;return m}
function levelOf(sp){const L=levels();let l=L[0];for(const x of L)if(sp>=x.min)l=x;return l}

function zcell(k,p,s,now){
  if(k==='grp')return [esc(grpName(p.group))];
  if(k==='ip')return [esc(p.ip||'')];
  if(!s)return [''];
  const L=limitMs(s),left=L!=null?L-elapsed(s,now):null;
  switch(k){
    case 'tarif':return [esc(s.tname)];
    case 'bal':{const cl=creditLeft(s,now);return [num(cl),cl<0?'neg':'']}
    case 'start':return [hms(s.start)];
    case 'end':{const e=endAt(s,now);return [e?hms(e):'']}
    case 'vaqt':return [dur(elapsed(s,now))];
    case 'left':return [left!=null?durS(left):'',left!=null&&left<5*MIN?'low':''];
    case 'bar':return [s.bar.length?num(barTotal(s)):''];
    case 'sum':return [num(accrued(s,now))];
    case 'played':return [num(played(s,now)),'blue'];
    case 'client':return [esc(who(s))];
    case 'mode':return [MODES[s.mode]];
    case 'note':return [esc(s.note)];
  }
  return [''];
}

function zalAction(a){
  const sel=selPcs();if(!sel.length)return toast('Avval jadvaldan kompyuterni tanlang','err');
  const one=sel[0];
  if(a==='start'){if(one.status==='off'&&!one.mac)return toast(`PC ${one.n} oʻchiq va MAC manzili yoʻq — avtomatik yoqib boʻlmaydi`,'err');return startModal(one.n)}
  if(a==='stop'){if(sel.length>1)return stopMany(sel);return stopModal(one.n)}
  if(a==='add')return addTimeModal(one.n);
  if(a==='move')return moveModal(one.n);
  if(a==='bar')return barSellModal(one.n);
  if(a==='msg')return msgModal(sel.filter(p=>p.status!=='off'));
  if(a==='shell')return openShell(one.n);
  if(['restart','shutdown','wake'].includes(a)&&!can('pcPower'))return toast('Kompyuterlarni boshqarishga ruxsat yoʻq','err');
  if(a==='pause'){const s=one.session,now=Date.now();
    if(one.status==='busy'){one.status='pause';s.pausedAt=now;addLog('info',`Seans pauza qilindi PC ${one.n} / ${who(s)}`)}
    else{s.pausedTotal+=now-s.pausedAt;s.pausedAt=null;one.status='busy';addLog('info',`Seans davom ettirildi PC ${one.n} / ${who(s)}`)}
    return commit()}
  if(a==='restart'){const l=sel.filter(p=>p.status!=='off');addLog('info',`Qayta yuklash buyrugʻi yuborildi → ${l.map(p=>'PC '+p.n).join(', ')}`);toast(`${l.length} ta kompyuter qayta yuklanmoqda`);return commit()}
  if(a==='shutdown'){const l=sel.filter(p=>p.status==='free');const skip=sel.length-l.length;
    l.forEach(p=>p.status='off');if(l.length)addLog('info',`Oʻchirildi → ${l.map(p=>'PC '+p.n).join(', ')}`);
    if(skip)toast(`${skip} ta kompyuterda seans ochiq — avval seansni yakunlang`,'err');return commit()}
  if(a==='wake'){wake(sel);return commit()}
}

function filteredLog(){const q=ui.logQ.trim().toLowerCase();return S.log.filter(l=>(ui.logF==='all'||l.type===ui.logF)&&(!q||l.text.toLowerCase().includes(q)))}
function renderLog(mode){
  const box=$('#log');if(!box)return;
  const atBottom=box.scrollTop+box.clientHeight>=box.scrollHeight-10;const prevH=box.scrollHeight,prevT=box.scrollTop;
  const list=filteredLog(),shown=list.slice(-ui.logLimit),more=list.length-shown.length;
  const TL={info:['Maʼlumot','p-mut'],warn:['Diqqat','p-pause'],msg:['Xabar','p-acc']};
  box.innerHTML=`<table class="lgt"><thead><tr><th></th><th>Sana</th><th>Vaqt</th><th>Turi</th><th style="text-align:right">PC</th><th>Xabar</th></tr></thead><tbody>
    <tr><td colspan="6" class="lgmore">${more>0?`↑ Yuqoriga suring — yana ${more} ta eski xabar`:'Jurnal boshi'}</td></tr>`+
    shown.map(l=>{const k=l.t+'|'+l.text.length,tl=TL[l.type]||TL.info,pc=(l.text.match(/PC (\d+)/)||[])[1];
      return `<tr class="lg lg-${l.type}${ui.logSel===k?' sel':''}" data-k="${k}"><td class="ic">${LOGI[l.type]||LOGI.info}</td><td class="nw">${dmy(l.t).slice(0,10)}</td><td class="nw">${hms(l.t)}</td><td class="nw"><span class="pill ${tl[1]}">${tl[0]}</span></td><td class="pc">${pc||''}</td><td>${esc(l.text)}</td></tr>`}).join('')+'</tbody></table>';
  $('#lgc').textContent=`${list.length} ta yozuv`;
  if(mode==='keep')box.scrollTop=box.scrollHeight-prevH+prevT;
  else if(mode==='bottom'||atBottom)box.scrollTop=box.scrollHeight;
  else box.scrollTop=prevT;
}

/* =================== HISOBOT =================== */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function stackChart(rows,colors,fmtY){
  const W=1000,H=250,pl=62,pr=8,pt=12,pb=26,iw=W-pl-pr,ih=H-pt-pb;
  const max=niceMax(Math.max(1,...rows.map(r=>r.vals.reduce((a,b)=>a+b,0))));
  const bw=iw/rows.length,step=Math.ceil(rows.length/12);
  let g='';for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-8}" y="${y+4}" text-anchor="end">${fmtY(max*i/4)}</text>`}
  rows.forEach((r,i)=>{let y=pt+ih;const x=pl+i*bw+bw*.16,w=bw*.68;
    r.vals.forEach((v,j)=>{const h=v/max*ih;if(h>0){y-=h;g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${colors[j]}" rx="1.5"><title>${esc(r.label)}: ${r.vals.map(som).join(' + ')}</title></rect>`}});
    if(i%step===0)g+=`<text x="${(pl+i*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(r.label)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tushum grafigi">${g}</svg>`;
}
/* ---------- Qarzdorlar (bir kishining barcha qarz va toʻlovlari bitta hisobda) ---------- */
const debtKey=d=>d.clientId?'c:'+d.clientId:'n:'+String(d.name||'').trim().toLowerCase();
const dmy=t=>{const d=new Date(t);return p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+d.getFullYear()+' '+hm(t)};
function debtors(){
  const m={};
  const get=(key,src)=>m[key]||(m[key]={key,clientId:src.clientId||null,name:src.name,phone:src.phone||'',debt:0,paid:0,left:0,last:0,n:0});
  S.debts.forEach(d=>{const x=get(debtKey(d),d);x.debt+=d.amount;x.n++;x.last=Math.max(x.last,d.t);if(d.phone&&!x.phone)x.phone=d.phone});
  S.debtPays.forEach(p=>{const x=get(p.key,p);x.paid+=p.amount+(p.disc||0);x.last=Math.max(x.last,p.t)});
  Object.values(m).forEach(x=>{const c=x.clientId&&client(x.clientId);if(c){x.name=c.name;x.phone=c.phone;x.login=c.login}x.left=x.debt-x.paid});
  return m;
}
function openDebtorCount(){return Object.values(debtors()).filter(x=>x.left>0).length}

/* ---------- Faylni saqlash: claude.ai havolasida «downloads», oddiy faylda odatiy yuklab olish ---------- */
async function saveFile(fname,data,mime){
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){dl=null}
  if(dl){try{await dl.save({filename:fname,data});return 'saved'}catch(e){if(e&&e.code==='declined')return 'declined';throw e}}
  const blob=data instanceof Blob?data:new Blob([data],{type:mime||'application/octet-stream'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  return 'saved';
}

function repRange(pre){const t0=sod(Date.now()),now=new Date();let f,t;

  else if(pre==='month'){const d=new Date(t0);d.setDate(1);f=d.getTime();t=t0+DAY-MIN}
  else{f=t0;t=t0+DAY-MIN}
  return {pre,f,t}}

function expenseModal(){

    actions:[{label:'Bekor qilish'},{label:'Qoʻshish',cls:'pri',run:()=>{const a=vn('ex-a');if(!a)return $('#ex-e').textContent='Summani kiriting',false;
      const t=new Date(v('ex-d')+'T12:00').getTime()||Date.now();S.expenses.push({id:uid(),t,cat:v('ex-c'),amount:a,note:v('ex-n').trim()});ui.pm=ymKey(t);commit();toast('Xarajat qoʻshildi')}}]});
}
function vProfit(m){
  if(!can('foyda'))return vReport(m);
  const months=[...new Set([...S.ledger.map(e=>ymKey(e.t)),...S.expenses.map(e=>ymKey(e.t))])].sort().reverse();
  if(!ui.pm||!months.includes(ui.pm))ui.pm=months[0]||ymKey(Date.now());
  const k=ui.pm,L=S.ledger.filter(e=>ymKey(e.t)===k),E=S.expenses.filter(e=>ymKey(e.t)===k).sort((a,b)=>a.t-b.t);
  const pc=L.filter(e=>e.kind==='pc').reduce((a,e)=>a+e.amount,0),bar=L.filter(e=>e.kind==='bar').reduce((a,e)=>a+e.amount,0),cogs=L.filter(e=>e.kind==='bar').reduce((a,e)=>a+(e.cost||0),0);
  const byCat={};E.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+e.amount);const exp=E.filter(e=>e.cat!=='Bar xaridi').reduce((a,e)=>a+e.amount,0),barBuy=E.filter(e=>e.cat==='Bar xaridi').reduce((a,e)=>a+e.amount,0);
  let dsc=0;S.debtPays.forEach(x=>{if(x.disc&&ymKey(x.t)===k)dsc+=x.disc});
  const rev=pc+bar,gross=rev-cogs,net=gross-exp-dsc;
  const [y,mo]=k.split('-').map(Number);
  m.innerHTML=`<div class="page"><div class="ph"><h1>Foyda hisob-kitobi</h1><select id="pm" class="btn" aria-label="Oy">${months.map(x=>{const[a,b]=x.split('-').map(Number);return `<option value="${x}"${x===k?' selected':''}>${MONL[b-1]} ${a}</option>`}).join('')}</select><button class="btn pri" type="button" id="ex-new">Xarajat qoʻshish</button></div>
    <div class="kpis"><div class="kpi"><div class="l">Tushum</div><div class="v">${som(rev)}</div><div class="s">kompyuter ${compact(pc)} · bar ${compact(bar)}</div></div>
      <div class="kpi"><div class="l">Bar tannarxi</div><div class="v">${som(cogs)}</div><div class="s">bar ustamasi ${som(bar-cogs)}</div></div>
      <div class="kpi"><div class="l">Xarajatlar</div><div class="v">${som(exp+dsc)}</div><div class="s">${E.length} ta yozuv${dsc?` · chegirma ${compact(dsc)}`:''}</div></div>
      <div class="kpi ${net>=0?'good':'bad'}"><div class="l">Sof foyda</div><div class="v">${som(net)}</div><div class="s">rentabellik ${rev?Math.round(net/rev*100):0}%</div></div></div>
    <div class="cols"><div class="box"><h2>${MONL[mo-1]} ${y}: foyda va zarar</h2><div class="tbl"><table class="t pl"><tbody>
      <tr class="sub"><td style="padding-left:12px">Tushum</td><td class="r">${som(rev)}</td></tr><tr><td>Kompyuter vaqti</td><td class="r">${som(pc)}</td></tr><tr><td>Bar sotuvi</td><td class="r">${som(bar)}</td></tr>
      <tr><td>Bar tannarxi</td><td class="r">−${som(cogs)}</td></tr><tr class="sub"><td style="padding-left:12px">Yalpi foyda</td><td class="r">${som(gross)}</td></tr>
      ${EXP_CATS.filter(c=>byCat[c]).map(c=>`<tr><td>${c}</td><td class="r">−${som(byCat[c])}</td></tr>`).join('')}
      ${dsc?`<tr><td>Qarz chegirmalari</td><td class="r">−${som(dsc)}</td></tr>`:''}
      <tr class="tot"><td style="padding-left:12px">Sof foyda</td><td class="r" style="color:${net>=0?'var(--ok)':'var(--off)'}">${som(net)}</td></tr></tbody></table></div></div>
    <div class="box"><h2>Xarajatlar roʻyxati</h2><div class="tbl">${E.length?`<table class="t"><thead><tr><th>Sana</th><th>Turi</th><th>Izoh</th><th class="r">Summa</th><th></th></tr></thead><tbody>${E.map(e=>`<tr><td>${dshort(e.t)}</td><td>${e.cat}</td><td class="muted">${esc(e.note)}</td><td class="r">${som(e.amount)}</td><td class="act"><button class="btn sm dng" type="button" data-xd="${e.id}" aria-label="Oʻchirish">×</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Bu oyda xarajat kiritilmagan</div>'}</div></div></div>
    <div class="note">Tushum kompyuter va bar sotuvidan hisoblanadi (balansdan yechilgan va qarzga berilgan summalar ham kiradi). Balans toʻldirish tushum emas — u mijozning oldindan toʻlovi.${barBuy?` Bar xaridlari (${som(barBuy)}) omborga kirim boʻlgani uchun xarajatga qoʻshilmaydi — sotilganda «Bar tannarxi» sifatida hisoblanadi.`:''}</div></div>`;
  $('#pm').onchange=e=>{ui.pm=e.target.value;vProfit(m)};$('#ex-new').onclick=expenseModal;
  $$('[data-xd]',m).forEach(b=>b.onclick=()=>confirmM('Xarajatni oʻchirish','Bu xarajat yozuvi oʻchirilsinmi?',()=>{S.expenses=S.expenses.filter(e=>e.id!==b.dataset.xd);commit()},'Oʻchirish'));
}

      actions:[{label:'Bekor qilish'},{label:'Oʻtkazish',cls:'pri',run:()=>{l.forEach(p=>p.group=v('pg-g'));commit();toast('Guruh oʻzgartirildi')}}]})};

    if(l.length>=S.pcs.length)return toast('Kamida bitta kompyuter qolishi kerak','err');

      S.pcs=S.pcs.filter(p=>!ui.pcChk.has(p.n));l.forEach(p=>ui.sel.delete(p.n));ui.pcChk=new Set();
      addLog('info',`Kompyuter oʻchirildi: PC ${rangeTxt(l.map(p=>p.n))}`);commit();toast(`${l.length} ta kompyuter oʻchirildi`)},'Oʻchirish')};
}

function pcsBehavior(b,tabs){

    </div></div></div>

  $('#bh-wake').onchange=e=>{be.autoWake=e.target.checked;ok()};

function pcAddModal(){

    <div id="pa-one" class="frm"><label>IP manzil<input id="pa-ip" placeholder="192.168.1.${200+next}"></label>
    <label>MAC manzil<input id="pa-mac" placeholder="Boʻsh qoldirilsa — klient ulanganda avtomatik aniqlanadi"></label></div>

      nums.forEach(n=>S.pcs.push({n,status:'free',session:null,group:v('pa-g'),ip,mac,paired:false,inbox:[]}));

function discCalc(given,pct,left){let a=given,ded=Math.round(given*(1+pct/100));if(ded>left){ded=left;a=Math.ceil(left/(1+pct/100))}return {a,ded,disc:ded-a}}

  const d=S.settings.debtDisc;
  b.innerHTML=`<div class="box"><h2>Qarz toʻlovida chegirma</h2><div class="boxb"><div class="frm" style="max-width:520px">
    <label class="ck">${sw('dd-on',d.on,'Chegirma yoqilgan')}Qarz toʻlanayotganda chegirma qoʻllansin</label>
    <label>Chegirma foizi (%)<input id="dd-p" type="number" min="0" max="100" step="1" value="${d.pct}"></label>
    <div class="flabel">Misol</div><div class="sumbox" id="dd-ex"></div>
    <div><button class="btn pri" type="button" id="dd-s">Saqlash</button></div></div></div></div>
    <div class="note">Mijoz qarzini toʻlayotganda bergan summasiga shu foiz qoʻshilib, qarzidan ayriladi. Foizni toʻlov oynasida har safar oʻzgartirish yoki oʻchirish mumkin. Berilgan chegirmalar Foyda hisob-kitobida alohida qatorda koʻrinadi.</div>`;
  const ex=()=>{const on=$('#dd-on').checked,p=on?Math.max(0,Math.min(100,+v('dd-p')||0)):0,r=discCalc(100000,p,200000);
    $('#dd-ex').innerHTML=`<div class="ln"><span>Qarz</span><span>${som(200000)}</span></div><div class="ln"><span>Mijoz berdi</span><span>${som(r.a)}</span></div><div class="ln"><span>Chegirma ${p}%</span><span>+${som(r.disc)}</span></div><div class="ln big"><span>Qarzdan ayriladi</span><span>${som(r.ded)}</span></div><div class="ln muted"><span>Qolgan qarz</span><span>${som(200000-r.ded)}</span></div>`};
  b.addEventListener('input',ex);b.addEventListener('change',ex);ex();
  $('#dd-s').onclick=()=>{d.on=$('#dd-on').checked;d.pct=Math.max(0,Math.min(100,+v('dd-p')||0));save();toast('Chegirma saqlandi')};
}

function ordEditor(box,list,order,vis,fixTxt){
  const lab=Object.fromEntries(list.map(x=>[x[0],x[1]]));let drag=null;
  const draw=()=>{box.innerHTML=`<div class="ord-fix">${fixTxt}</div>`+order.map((k,i)=>`<div class="ord-r" draggable="true" data-k="${k}"><span class="hd" aria-hidden="true">⋮⋮</span>
    <label><input type="checkbox" data-v="${k}"${vis[k]?' checked':''}>${lab[k]}</label>
    <button class="btn sm" type="button" data-m="-1" data-k="${k}"${i===0?' disabled':''} aria-label="${lab[k]} — yuqoriga">↑</button><button class="btn sm" type="button" data-m="1" data-k="${k}"${i===order.length-1?' disabled':''} aria-label="${lab[k]} — pastga">↓</button></div>`).join('');
    $$('[data-v]',box).forEach(x=>x.onchange=()=>{vis[x.dataset.v]=x.checked;save()});
    $$('[data-m]',box).forEach(x=>x.onclick=()=>{const i=order.indexOf(x.dataset.k),j=i+ +x.dataset.m;if(j<0||j>=order.length)return;[order[i],order[j]]=[order[j],order[i]];save();draw();const f=$(`[data-m="${x.dataset.m}"][data-k="${x.dataset.k}"]`,box);if(f&&!f.disabled)f.focus()});
    $$('.ord-r',box).forEach(r=>{
      r.ondragstart=e=>{drag=r.dataset.k;r.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',drag)}catch(err){}};
      r.ondragend=()=>{drag=null;$$('.ord-r',box).forEach(x=>x.classList.remove('dragging','over'))};
      r.ondragover=e=>{if(!drag)return;e.preventDefault();$$('.ord-r',box).forEach(x=>x.classList.toggle('over',x===r))};
      r.ondrop=e=>{e.preventDefault();if(!drag||drag===r.dataset.k)return;const from=order.indexOf(drag);order.splice(from,1);order.splice(order.indexOf(r.dataset.k),0,drag);save();draw()};
    });
  };draw();
}

/* ---------- Backup ---------- */
const bk={dir:null,t:null,err:'',timer:null};
const bkName=()=>(S.settings.name||'KLUB').replace(/[^A-Za-z0-9ʻ'-]+/g,'-').replace(/^-+|-+$/g,'').toUpperCase()+'-backup.json';
async function bkWrite(){if(!bk.dir)return;try{const fh=await bk.dir.getFileHandle(bkName(),{create:true});const w=await fh.createWritable();await w.write(JSON.stringify(S));await w.close();bk.t=Date.now();bk.err=''}
  catch(e){bk.err=e.message||String(e)}if(ui.view==='sozlamalar'&&ui.setSec==='data'&&$('#bk-st'))bkStatus()}
function bkSchedule(){if(!bk.dir)return;clearTimeout(bk.timer);bk.timer=setTimeout(bkWrite,1500)}
function bkStatus(){const el=$('#bk-st');if(!el)return;
  const on=!!bk.dir,prev=S.settings.backupDir;
  el.innerHTML=`<i class="dot ${on?(bk.err?'bad':'ok'):''}"></i><div><b>${on?`Papka: ${esc(bk.dir.name)}`:prev?`Papka qayta tanlanishi kerak (${esc(prev)})`:'Papka tanlanmagan'}</b>
    <small>${on?(bk.err?`Saqlashda xato: ${esc(bk.err)}`:`${esc(bkName())} · oxirgi saqlash: ${bk.t?hms(bk.t):'—'}`):prev?'Brauzer xavfsizlik uchun papkaga ruxsatni har safar dastur ochilganda qayta soʻraydi.':'Hozircha maʼlumotlar faqat shu kompyuterdagi bazada saqlanmoqda.'}</small></div>`}

  b.innerHTML=`<div class="box"><h2>Avto backup</h2><div class="boxb">
    <p class="note" style="margin-top:0">Papkani bir marta tanlaysiz. Dastur oʻsha papkada bitta <b>${esc(bkName())}</b> fayl yaratadi va har safar ochilganda hamda har bir oʻzgarishdan keyin shu faylni yangilab boradi — yangi fayllar yaratilmaydi.</p>
    <div class="bkst" id="bk-st"></div>
    <div class="qk" style="margin-top:12px"><button class="btn pri" type="button" id="bk-pick">${bk.dir?'Boshqa papka tanlash':'Papkani tanlash'}</button>${bk.dir?'<button class="btn" type="button" id="bk-now">Hozir saqlash</button><button class="btn" type="button" id="bk-off">Avto backupni oʻchirish</button>':''}</div>
    <div class="flabel" style="margin-top:16px">Qoʻlda</div>
    <div class="qk"><button class="btn" type="button" id="bk-dl">Backup faylni yuklab olish</button><button class="btn" type="button" id="bk-up">Backupdan tiklash</button><button class="btn" type="button" id="bk-js">JSON nusxasini koʻrsatish</button><input type="file" id="bk-file" accept=".json,application/json" hidden></div>
  </div></div>
  <div class="box"><h2>Namuna maʼlumotlar</h2><div class="boxb"><p class="note" style="margin-top:0">Prototipni boshidan boshlash uchun — barcha oʻzgarishlar oʻchadi.</p><button class="btn dng" type="button" id="se-r">Namuna maʼlumotlarni qayta tiklash</button></div></div>`;
  bkStatus();
  $('#bk-pick').onclick=async()=>{
    if(!window.showDirectoryPicker)return toast('Bu brauzer papka tanlashni qoʻllab-quvvatlamaydi. Chrome yoki Edge kerak; hozircha «Backup faylni yuklab olish» dan foydalaning.','err');
    try{bk.dir=await window.showDirectoryPicker({mode:'readwrite',id:'klubpult-backup'});S.settings.backupDir=bk.dir.name;save();await bkWrite();addLog('info',`Avto backup yoqildi: ${bk.dir.name}/${bkName()}`);setData(b);toast('Avto backup yoqildi')}
    catch(e){if(e&&e.name==='AbortError')return;toast('Papkaga ruxsat berilmadi: '+(e.message||e),'err')}};
  if($('#bk-now'))$('#bk-now').onclick=async()=>{await bkWrite();toast(bk.err?'Saqlab boʻlmadi':'Backup saqlandi',bk.err?'err':'')};
  if($('#bk-off'))$('#bk-off').onclick=()=>{bk.dir=null;S.settings.backupDir='';save();setData(b);toast('Avto backup oʻchirildi')};
  $('#bk-dl').onclick=async()=>{const d=new Date(),fname=bkName().replace('.json',`-${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}.json`),json=JSON.stringify(S,null,1);
    // claude.ai havolasida brauzer yuklab olishni faqat "downloads" orqali ruxsat beradi; oddiy faylda odatiy havola ishlaydi
    let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){dl=null}
    if(dl){try{await dl.save({filename:fname,data:json});toast('Backup fayli saqlandi')}catch(e){if(e&&e.code!=='declined')toast('Saqlab boʻlmadi: '+((e&&e.message)||'xato')+'. «JSON nusxasini koʻrsatish» dan foydalaning.','err')}return}
    try{const blob=new Blob([json],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('Yuklab olish boshlandi. Fayl chiqmasa, «JSON nusxasini koʻrsatish» dan foydalaning.')}catch(e){toast('Yuklab olib boʻlmadi','err')}};
  $('#bk-js').onclick=()=>modal({title:'Backup (JSON)',wide:true,body:`<div class="frm"><textarea id="bk-ta" rows="12" readonly class="mono" style="font-size:11.5px">${esc(JSON.stringify(S))}</textarea><div class="note">Matnni toʻliq nusxalab, .json fayl sifatida saqlang.</div></div>`,
    actions:[{label:'Yopish'},{label:'Nusxalash',cls:'pri',run:()=>{const ta=$('#bk-ta');try{navigator.clipboard.writeText(ta.value).then(()=>toast('Nusxalandi'),()=>{ta.select();toast('Belgilandi — Ctrl+C bosing')})}catch(e){ta.select();toast('Belgilandi — Ctrl+C bosing')}return false}}]});
  $('#bk-up').onclick=()=>$('#bk-file').click();
  $('#bk-file').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{let o;try{o=JSON.parse(rd.result)}catch(err){return toast('Fayl JSON emas yoki buzilgan','err')}
    if(!o||o.v!==1||!Array.isArray(o.pcs)||!Array.isArray(o.clients))return toast('Bu Klub Pult backup fayli emas','err');
    confirmM('Backupdan tiklash',`${esc(f.name)} faylidagi maʼlumotlar joriy maʼlumotlar oʻrniga yoziladi: ${o.pcs.length} ta kompyuter, ${o.clients.length} ta mijoz, ${(o.history||[]).length} ta seans. Davom etasizmi?`,()=>{
      S=o;migrate();if(!S.users.some(u=>u.login===S.user))S.user=S.users[0].login;applyTheme();save();ui.sel.clear();addLog('warn',`Maʼlumotlar backupdan tiklandi: ${f.name}`);commit();toast('Backupdan tiklandi')},'Tiklash')};rd.readAsText(f);e.target.value=''};
  $('#se-r').onclick=()=>confirmM('Qayta tiklash','Barcha oʻzgarishlar oʻchib, namuna maʼlumotlar qaytadan yaratiladi. Davom etasizmi?',()=>{seed();migrate();S.user='admin';applyTheme();save();ui.sel.clear();commit();toast('Namuna maʼlumotlar tiklandi')},'Tiklash');
}

/* =================== MIJOZ EKRANI (klient kompyuter simulyatsiyasi) =================== */
const sh={n:null};
function openShell(n){sh.n=n;let el=$('#shell');if(!el){el=document.createElement('div');el.id='shell';el.className='shell';el.setAttribute('role','dialog');el.setAttribute('aria-label','Mijoz ekrani');document.body.appendChild(el)}renderShell()}
function closeShell(){const el=$('#shell');if(el)el.remove();sh.n=null}
function shSig(p){return p.status+'|'+(p.session?p.session.id:'')+'|'+(S.settings.lockSentAt||0)+'|'+S.settings.beh.timer+'|'+p.mac}
function renderShell(){
  const el=$('#shell');if(!el)return;const p=pcBy(sh.n);if(!p)return closeShell();
  const s=p.session;let body;
  if(p.status==='off')body=`<div class="sh-lock sh-offs"><div class="sh-big">PC ${p.n}</div><p>Kompyuter oʻchiq.${p.mac?' Zalda «Yoqish» bosilsa yoki vaqt ochilsa, Wake-on-LAN orqali yonadi.':' MAC manzil kiritilmagan — Wake-on-LAN ishlamaydi.'}</p></div>`;
  else if(!s||p.status==='pause')body=lockHTML(lockFor(p),{n:p.n,interactive:!s,sub:p.status==='pause'?'Seans pauza qilingan — davom ettirish uchun administratorga murojaat qiling':null});
  else body=`<div class="dk"><div class="dk-note">Kompyuter ochiq — mijoz oʻynamoqda</div>
      ${S.settings.beh.timer?`<div class="tw"><div class="tw-h">PC ${p2(p.n)} · ${esc(s.tname)}</div><div class="tw-l" id="tw-ll"></div><div class="tw-t" id="sh-tl"></div><div class="tw-s">${esc(who(s))}</div><button type="button" class="tw-b" id="tw-req">Vaqt soʻrash</button></div>`:''}
      <div class="dk-bar"><i></i><i></i><i></i><span class="mono" id="dk-clk"></span></div></div>`;
  el.innerHTML=`<div class="sh-sim"><b>Mijoz ekrani</b><span>klient kompyuter simulyatsiyasi</span><select id="sh-pc" aria-label="Kompyuter">${S.pcs.map(x=>`<option value="${x.n}"${x.n===p.n?' selected':''}>PC ${x.n} — ${STATUS[x.status]}</option>`).join('')}</select><button class="btn sm" type="button" id="sh-x">Yopish (Esc)</button></div>
    <div class="sh-screen">${body}<div class="sh-pop" id="sh-pop"></div></div>`;
  el.dataset.sig=shSig(p);el.dataset.pop='';
  $('#sh-x').onclick=closeShell;
  $('#sh-pc').onchange=e=>{sh.n=+e.target.value;renderShell()};
  const lf=$('#lk-lf');
  if(lf)lf.onsubmit=e=>{e.preventDefault();const er=$('#lk-e');
    const c=S.clients.find(x=>x.login===v('lk-l').trim().toLowerCase());
    if(!c||c.pass!==v('lk-p'))return er.textContent='Login yoki parol notoʻgʻri';
    const other=S.pcs.find(x=>x.session&&x.session.clientId===c.id);if(other)return er.textContent=`Siz PC ${other.n} da oʻynayapsiz`;
    const t=S.tariffs.find(x=>x.type==='hour'&&applies(x)&&grpAllows(p.group,x));if(!t)return er.textContent='Hozir amal qiladigan tarif yoʻq — administratorga murojaat qiling';
    if(c.balance<t.price/60)return er.textContent=`Balans yetarli emas (${som(c.balance)}). Administratorda toʻldiring.`;
    startSession(p.n,{clientId:c.id,mode:'balance',tariffId:t.id,note:'Qulf ekranidan kirdi'});save();renderNav();if(ui.view==='zal')renderGrid();renderShell()};
  if($('#tw-req'))$('#tw-req').onclick=()=>{addLog('warn',`PC ${p.n}: mijoz vaqt soʻramoqda (${who(s)})`);save();pushInbox(p,'Soʻrovingiz administratorga yuborildi.','Tizim');updateShell()};
  updateShell();
}
function updateShell(){
  const el=$('#shell');if(!el)return;const p=pcBy(sh.n);if(!p)return closeShell();
  if(el.dataset.sig!==shSig(p))return renderShell();
  const s=p.session,now=Date.now();
  const dk=$('#dk-clk');if(dk)dk.textContent=hm(now);
  if(s){const L=limitMs(s),e2=elapsed(s,now),tl=$('#sh-tl');
    if(tl){tl.textContent=L!=null?durS(L-e2):durS(e2);tl.classList.toggle('low',L!=null&&L-e2<5*MIN);$('#tw-ll').textContent=L!=null?'Qolgan vaqt':'Oʻtgan vaqt'}}
  const un=(p.inbox||[]).filter(m=>!m.seen),key=un.map(m=>m.t).join(',');
  if(el.dataset.pop!==key){el.dataset.pop=key;const pop=$('#sh-pop');
    pop.innerHTML=un.slice(-3).map(m=>`<div class="sh-msg" role="alert"><b>${esc(m.from)}</b><span>${esc(m.text)}</span><button class="btn sm pri" type="button" data-ok="${m.t}">OK</button></div>`).join('');
    $$('[data-ok]',pop).forEach(x=>x.onclick=()=>{p.inbox.forEach(m=>{if(String(m.t)===x.dataset.ok)m.seen=true});save();updateShell()})}
}

/* =================== Foydalanuvchini almashtirish =================== */
function loginModal(){
  modal({title:'Tizimga kirish',body:`<div class="frm"><label>Foydalanuvchi<select id="lg-u">${S.users.map(u=>`<option value="${u.login}"${u.login===S.user?' selected':''}>${esc(u.name)} (${u.role==='admin'?'admin':'operator'})</option>`).join('')}</select></label>
    <label>Parol<input id="lg-p" type="password" autocomplete="off"></label><div class="note">Prototip parollari: admin — <b>admin</b>, operator — <b>1111</b></div><div class="err" id="lg-e"></div></div>`,
    actions:[{label:'Bekor qilish'},{label:'Kirish',cls:'pri',run:()=>{const u=S.users.find(x=>x.login===v('lg-u'));if(!u||u.pass!==v('lg-p'))return $('#lg-e').textContent='Parol notoʻgʻri',false;
      S.user=u.login;addLog('info',`Tizimga kirdi: ${u.name}`);if(!viewOk(ui.view))ui.view='zal';commit();toast(`Xush kelibsiz, ${u.name}`)}}],
    onMount:ov=>$('#lg-p',ov).addEventListener('keydown',e=>{if(e.key==='Enter')$('.dlg-f .pri',ov).click()})});
}

/* =================== Ishga tushirish =================== */
S=load()||seed();
if(!S.pcs||!S.pcs.length)seed();
migrate();
applyTheme();
{const f=S.pcs.find(active);if(f){ui.sel.add(f.n);ui.last=f.n}}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b)go(b.dataset.v)});
$('#nav2').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b)go(b.dataset.v)});
$('#meBtn').onclick=loginModal;
$('#themeBtn').onclick=()=>{const cur=S.settings.theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):S.settings.theme;S.settings.theme=cur==='dark'?'light':'dark';applyTheme();save();renderNav()};
save();renderNav();render();

setInterval(()=>{
  const now=Date.now();let ch=false;
  const w=S.settings.warn;
  S.pcs.forEach(p=>{const s=p.session;if(!s||p.status!=='busy')return;const L=limitMs(s);if(L==null)return;
    const left=L-elapsed(s,now);
    if(left<=0){finishSession(p.n,barTotal(s)>0?'debt':'none',true);ch=true;const be=S.settings.beh;
      if(be.end==='off'){p.status='off';addLog('info',`PC ${p.n}: vaqt tugadi — kompyuter oʻchirildi`)}
      else if(be.end==='lockoff'){p.offAt=now+be.offMin*MIN;addLog('info',`PC ${p.n}: vaqt tugadi — qulflandi, ${be.offMin} daqiqadan soʻng oʻchadi`)}
      return}
    if(w.on){s.warned=s.warned||[];w.mins.forEach(mm=>{if(left<=mm*MIN&&L>mm*MIN&&!s.warned.includes(mm)){s.warned.push(mm);const t=w.text.replace(/\{min\}/g,mm);
      pushInbox(p,t,'Avtomatik');addLog('msg',`Avtomatik ogohlantirish → PC ${p.n}: "${t}"`);ch=true}})}});
  S.pcs.forEach(p=>{if(p.offAt&&now>=p.offAt){if(p.status==='free'){p.status='off';addLog('info',`PC ${p.n}: yangi vaqt ochilmadi — kompyuter oʻchirildi`);ch=true}p.offAt=null}});
  $$('[data-lkclk]').forEach(e=>{const x=hm(now);if(e.textContent!==x)e.textContent=x});
  {const sc=$('#srv-clk');if(sc)sc.textContent=hms(now)}
  if(ch){save();renderNav();if(ui.view!=='zal'&&!(ui.view==='sozlamalar'&&document.activeElement&&document.activeElement.closest('.set-body')))render()}
  if(ui.view==='zal'){updateClock();renderGrid();updateToolbar()}
  updateShell();
},1000);
})();
</script>
