<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klub Pult</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#e9edf1;--panel:#ffffff;--panel2:#f4f6f8;--side:#f1f6fa;--line:#cdd4db;--line2:#e2e7eb;
  --text:#1a2631;--muted:#5b6874;--accent:#0a8bb0;--accent-ink:#ffffff;--accent-soft:#d3edf5;
  --sel:#d6dbe0;--hover:#edf4f8;--ok:#1d9a52;--busy:#1f6fd0;--warn:#c98200;--off:#c0322a;
  --ok-soft:#dcf3e5;--busy-soft:#dde9fb;--warn-soft:#fbefd2;--off-soft:#f8dedb;
  --tool:#f3f4f6;--tool-b:#dde1e5;--ov:rgba(14,26,38,.4);--shadow:0 14px 44px rgba(14,30,46,.24);
  --c1:#0a8bb0;--c2:#e0891c;--c3:#7a5bd6;--c4:#2f9e6a;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1317;--panel:#151c22;--panel2:#1a2229;--side:#12191e;--line:#2b353e;--line2:#212a32;
  --text:#dbe4ea;--muted:#8e9ba6;--accent:#35b5d8;--accent-ink:#06222c;--accent-soft:#123a46;
  --sel:#27323b;--hover:#1b252d;--ok:#3ccb78;--busy:#62a2ff;--warn:#f0b43c;--off:#f0645a;
  --ok-soft:#133526;--busy-soft:#172a45;--warn-soft:#3a2e12;--off-soft:#3d1a18;
  --tool:#171f25;--tool-b:#29333b;--ov:rgba(0,0,0,.55);--shadow:0 14px 44px rgba(0,0,0,.5);
  --c1:#35b5d8;--c2:#f0a040;--c3:#a08bff;--c4:#4fd08f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1317;--panel:#151c22;--panel2:#1a2229;--side:#12191e;--line:#2b353e;--line2:#212a32;
  --text:#dbe4ea;--muted:#8e9ba6;--accent:#35b5d8;--accent-ink:#06222c;--accent-soft:#123a46;
  --sel:#27323b;--hover:#1b252d;--ok:#3ccb78;--busy:#62a2ff;--warn:#f0b43c;--off:#f0645a;
  --ok-soft:#133526;--busy-soft:#172a45;--warn-soft:#3a2e12;--off-soft:#3d1a18;
  --tool:#171f25;--tool-b:#29333b;--ov:rgba(0,0,0,.55);--shadow:0 14px 44px rgba(0,0,0,.5);
  --c1:#35b5d8;--c2:#f0a040;--c3:#a08bff;--c4:#4fd08f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:216px minmax(0,1fr);height:100%}
.side{background:var(--side);border-right:1px solid var(--line2);display:flex;flex-direction:column;padding:14px 10px 12px;gap:2px;overflow:auto}
.brand{padding:2px 12px 14px;display:flex;flex-direction:column}
.brand b{font-size:15px;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:9px 12px;border:0;border-left:3px solid transparent;border-radius:8px;background:none;color:var(--muted);font-weight:500;cursor:pointer}
.nav button:hover{background:var(--hover);color:var(--text)}
.nav button.on{background:var(--accent-soft);color:var(--text);font-weight:700;border-left-color:var(--accent)}
.nav button.locked{opacity:.45;cursor:not-allowed}
.nav .badge{font-size:11px;font-weight:600;color:var(--text);min-width:18px;text-align:right}
.nav .badge.red{background:var(--off);color:#fff;border-radius:99px;padding:0 6px;text-align:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px}
.me{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line2);border-radius:10px;background:var(--panel);cursor:pointer;text-align:left}
.me .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12px;flex:none}
.me small{display:block;color:var(--muted);font-size:11px}
.themebtn{border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:7px 10px;cursor:pointer;color:var(--muted);font-size:12.5px;text-align:left}

.main{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column}

/* ---------- Zal ---------- */
.zal{display:flex;flex-direction:column;height:100%;min-height:0}
.toolbar{display:flex;align-items:stretch;gap:2px;padding:6px 8px;background:var(--tool);border-bottom:1px solid var(--tool-b);flex-wrap:wrap}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;min-width:70px;padding:5px 6px 4px;border:1px solid transparent;border-radius:4px;background:none;color:var(--text);font-size:12px;cursor:pointer;white-space:nowrap}
.tb:hover:not(:disabled){background:var(--panel);border-color:var(--tool-b)}
.tb:active:not(:disabled){transform:translateY(1px)}
.tb:disabled{opacity:.38;cursor:default}
.tb svg{width:30px;height:30px}
.tb-sep{width:1px;background:var(--tool-b);margin:4px 6px}
.ico-scr{fill:var(--panel2);stroke:var(--muted)}
.clock{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:2px;padding:0 4px}
.clock .t{font:500 22px/1 "JetBrains Mono",ui-monospace,monospace;border:1px solid var(--tool-b);background:var(--panel);padding:4px 10px;border-radius:3px;letter-spacing:.04em}
.clock .d{font-size:12px;color:var(--muted)}
.subbar{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--panel2);border-bottom:1px solid var(--line2);flex-wrap:wrap}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tabs button{border:0;background:var(--panel);padding:4px 12px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--text)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.chip b{font-weight:700}
.subbar input{margin-left:auto;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);min-width:0;width:200px}

.st{display:inline-block;width:11px;height:11px;flex:none;vertical-align:-1px}
.st-free{background:var(--ok);border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.st-busy{width:0;height:0;border-left:11px solid var(--busy);border-top:6px solid transparent;border-bottom:6px solid transparent}
.st-pause{border-left:4px solid var(--warn);border-right:4px solid var(--warn);width:11px}
.st-off{background:var(--off);border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}

.gridwrap{flex:1;min-height:120px;overflow:auto;background:var(--panel)}
table.pcs{border-collapse:collapse;min-width:100%;font-size:15px;font-variant-numeric:tabular-nums;user-select:none}
table.pcs th{position:sticky;top:0;z-index:1;background:var(--panel2);border:1px solid var(--line);text-align:left;font-weight:600;padding:4px 6px;white-space:nowrap;font-size:13.5px;cursor:pointer}
table.pcs th .ar{font-size:10px;color:var(--muted)}
table.pcs td{border:1px solid var(--line2);padding:2px 6px;white-space:nowrap;height:26px}
table.pcs td.n{text-align:right;font-weight:600;width:1%}
table.pcs td.stc{width:1%;padding-right:4px}
table.pcs tr{cursor:default}
table.pcs tbody tr:hover td{background:var(--hover)}
table.pcs tr.sel td{background:var(--sel)}
table.pcs tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
table.pcs td.neg{color:var(--off)}
table.pcs td.low{color:var(--off);font-weight:600}
table.pcs tr.s-off td{color:var(--muted)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px;user-select:none}
.card{--stc:var(--ok);border:1px solid var(--line);border-top:4px solid var(--stc);border-radius:8px;background:var(--panel);padding:9px 10px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:112px}
.card:hover{background:var(--hover)}
.card.sel{outline:2px solid var(--accent);outline-offset:1px}
.card.s-busy{--stc:var(--busy)}.card.s-pause{--stc:var(--warn)}.card.s-off{--stc:var(--off);opacity:.72}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .pn{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.card .who{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tm{font:500 16px/1.2 "JetBrains Mono",ui-monospace,monospace}
.card .tm.low{color:var(--off)}
.card .sm{font-size:12.5px;font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line2);border-radius:4px;overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--stc)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.p-free{background:var(--ok-soft);color:var(--ok)}.p-busy{background:var(--busy-soft);color:var(--busy)}
.p-pause{background:var(--warn-soft);color:var(--warn)}.p-off{background:var(--off-soft);color:var(--off)}
.p-mut{background:var(--panel2);color:var(--muted);border:1px solid var(--line2)}
.p-acc{background:var(--accent-soft);color:var(--accent)}

.resize{height:7px;cursor:ns-resize;background:var(--tool);border-top:1px solid var(--line);border-bottom:1px solid var(--line2);position:relative;touch-action:none}
.resize::after{content:"";position:absolute;left:50%;top:2px;width:36px;height:2px;margin-left:-18px;border-top:1px solid var(--muted);border-bottom:1px solid var(--muted);opacity:.5}
.logp{height:220px;display:flex;flex-direction:column;background:var(--panel);min-height:80px}
.logh{display:flex;align-items:center;gap:8px;padding:4px 10px;border-bottom:1px solid var(--line2);font-size:12.5px;flex-wrap:wrap}
.logh select,.logh input{padding:2px 6px;border:1px solid var(--line);border-radius:5px;background:var(--panel2);font-size:12px}
.logh input{width:170px}
.log{flex:1;overflow:auto;font-size:12.5px;padding:2px 6px 6px;font-variant-numeric:tabular-nums}
.lg{display:flex;gap:6px;padding:1px 4px;align-items:flex-start;border:1px solid transparent;cursor:default}
.lg:hover{background:var(--hover)}
.lg.sel{border-color:var(--busy);background:var(--accent-soft)}
.lg .li{flex:none;width:15px;height:15px;margin-top:1px}
.lg .lt{flex:none;color:var(--muted)}
.lgmore{font-size:11.5px;color:var(--muted);text-align:center;padding:4px}

/* ---------- Pages ---------- */
.page{padding:20px 24px 32px;overflow:auto;height:100%;display:flex;flex-direction:column;gap:16px}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph h1{font-size:22px;margin:0 auto 0 0;text-wrap:balance}
.ph input[type=search]{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);width:220px;max-width:100%}
.box{background:var(--panel);border:1px solid var(--line2);border-radius:10px}
.box>h2{font-size:14px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
.box>h2 small{font-weight:400;color:var(--muted);margin-left:auto}
.boxb{padding:14px 16px}
.tbl{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.t th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;padding:9px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;background:var(--panel2)}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td.r,table.t th.r{text-align:right}
table.t td.act{white-space:nowrap;text-align:right}
table.t td small{display:block;color:var(--muted);font-size:12px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted);letter-spacing:.02em}
.kpi .v{font-size:19px;overflow-wrap:anywhere;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.good .v{color:var(--ok)}.kpi.bad .v{color:var(--off)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.note{font-size:12.5px;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:7px;padding:7px 12px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dng{color:var(--off);border-color:var(--off)}
.btn.sm{padding:3px 9px;font-size:12.5px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn+.btn{margin-left:4px}

.hbar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.hbar .tr{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--c1);border-radius:5px}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--panel2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
svg.chart .gl{stroke:var(--line2)}

.pl td:first-child{padding-left:28px}
.pl tr.tot td{font-weight:700;background:var(--panel2)}
.pl tr.sub td{font-weight:600}

/* ---------- Modal ---------- */
.ov{position:fixed;inset:0;background:var(--ov);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);width:min(470px,100%);max-height:calc(100% - 8px);display:flex;flex-direction:column;border:1px solid var(--line2)}
.dlg.wide{width:min(760px,100%)}
.dlg-h{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line2)}
.dlg-h h3{margin:0;font-size:16px}
.dlg-h .x{margin-left:auto;border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
.dlg-b{padding:16px;overflow:auto}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line2);flex-wrap:wrap}
.dlg-f .btn+.btn{margin-left:0}
.frm{display:grid;gap:12px}
.frm label{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
.frm input,.frm select,.frm textarea{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);width:100%}
.frm input:disabled,.frm select:disabled{opacity:.6}
.frm .ck{display:flex;align-items:center;gap:8px;color:var(--text);font-size:13.5px}
.frm .ck input{width:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qk{display:flex;gap:6px;flex-wrap:wrap}
.sumbox{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font-size:13.5px;display:grid;gap:4px}
.sumbox .ln{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.sumbox .ln.big{font-size:17px;font-weight:700;border-top:1px solid var(--line2);padding-top:6px;margin-top:2px}
.err{color:var(--off);font-size:12.5px;min-height:1em}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{display:flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--text)}

.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:9px 14px;border-radius:8px;box-shadow:var(--shadow);font-size:13.5px;max-width:340px;animation:tin .18s ease-out}
.toast.err{background:var(--off);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}

@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .side{flex-direction:row;align-items:center;padding:8px 16px;border-right:0;border-bottom:1px solid var(--line2);overflow-x:auto;gap:6px}
  .brand{display:none}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;border-radius:6px}
  .nav button.on{border-bottom-color:var(--accent)}
  .side-foot{margin:0;flex-direction:row;padding:0}
  .me small{display:none}
  .page{padding:16px}
  .tb{min-width:58px;font-size:11px}
  .tb svg{width:24px;height:24px}
  .clock{display:none}
  .subbar input{width:100%;margin-left:0}
  .row2{grid-template-columns:1fr}
  .logp{height:160px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><b id="clubName">CYBER ZAL</b><span id="clubHours"></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <nav class="nav" id="nav2"></nav>
      <button class="themebtn" id="themeBtn" type="button"></button>
      <button class="me" id="meBtn" type="button"></button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toasts" id="toasts"></div>

<script>
(function(){
'use strict';
/* =================== Konstantalar =================== */
const LS='klubpult_v1', LS_UI='klubpult_ui_v1';
const DAY=864e5, MIN=6e4, PCS=50;
const METHODS={cash:'Naqd',card:'Karta',click:'Click',payme:'Payme'};
const MODES={pre:'Oldindan toʻlov',post:'Keyin toʻlov',balance:'Balansdan'};
const STATUS={free:'Boʻsh',busy:'Band',pause:'Pauza',off:'Oʻchiq'};
const MON=['yan','fev','mar','apr','may','iyn','iyl','avg','sen','okt','noy','dek'];
const MONL=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
const WD=['Ya','Du','Se','Ch','Pa','Ju','Sh'];
const EXP_CATS=['Ijara','Elektr energiya','Internet','Ish haqi','Taʼmirlash','Boshqa'];
const LEVELS=[{n:'Bronze',min:0,b:0},{n:'Silver',min:500000,b:3},{n:'Gold',min:2000000,b:5},{n:'Platinum',min:5000000,b:7}];

/* =================== Yordamchilar =================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const r100=n=>Math.round(n/100)*100;
const num=n=>(n<0?'−':'')+Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const som=n=>num(n)+' soʻm';
const p2=n=>String(n).padStart(2,'0');
const hms=t=>{const d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())};
const hm=t=>{const d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())};
const dstr=t=>{const d=new Date(t);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()};
const dshort=t=>{const d=new Date(t);return d.getDate()+' '+MON[d.getMonth()]};
const dur=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/MIN);return Math.floor(m/60)+':'+p2(m%60)};
const durS=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000);return Math.floor(s/3600)+':'+p2(Math.floor(s/60)%60)+':'+p2(s%60)};
const durTxt=m=>{m=Math.round(m);const h=Math.floor(m/60),mm=m%60;return (h?h+' soat ':'')+(mm||!h?mm+' daqiqa':'')};
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const ymKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)};
const compact=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:1).replace('.',',')+' mln':n>=1e3?Math.round(n/1e3)+' ming':String(Math.round(n));
const v=id=>{const e=document.getElementById(id);return e?e.value:''};
const vn=id=>Math.max(0,Math.round(Number(String(v(id)).replace(/\s/g,''))||0));
function rng(seed){return ()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}}

/* =================== Seans hisob-kitobi =================== */
function elapsed(s,now=Date.now()){return Math.max(0,now-s.start-s.pausedTotal-(s.pausedAt?now-s.pausedAt:0))}
function limitMs(s){
  if(s.mode==='pre')return s.paidMin*MIN;
  if(s.mode==='balance'){const c=client(s.clientId);return c?Math.floor(c.balance/s.rate*60)*MIN:0}
  return null;
}
const barTotal=s=>s.bar.reduce((a,b)=>a+b.price*b.qty,0);
function timeCost(s,now){return r100(s.rate*Math.ceil(elapsed(s,now)/MIN)/60)}
function accrued(s,now){return (s.mode==='pre'?s.paid:timeCost(s,now))+barTotal(s)}
function creditLeft(s,now){
  if(s.mode==='pre')return s.paid-timeCost(s,now)-barTotal(s);
  if(s.mode==='balance'){const c=client(s.clientId);return (c?c.balance:0)-timeCost(s,now)-barTotal(s)}
  return -(timeCost(s,now)+barTotal(s));
}
function endAt(s,now=Date.now()){const L=limitMs(s);return L==null?null:s.start+s.pausedTotal+(s.pausedAt?now-s.pausedAt:0)+L}
function applies(t,date=new Date()){
  if(!t.active||!(t.price>0))return false;
  if(t.days&&t.days.length&&!t.days.includes(date.getDay()))return false;
  if(t.from&&t.to){
    const c=date.getHours()*60+date.getMinutes();
    const [fh,fm]=t.from.split(':').map(Number),[th,tm]=t.to.split(':').map(Number);
    const f=fh*60+fm,e=th*60+tm;
    return f<=e?(c>=f&&c<e):(c>=f||c<e);
  }
  return true;
}
function led(kind,amount,method,extra){if(amount>0)S.ledger.push(Object.assign({id:uid(),t:Date.now(),kind,amount,method},extra||{}))}
function addLog(type,text,t){S.log.push({t:t||Date.now(),type,text});if(S.log.length>3000)S.log.splice(0,S.log.length-3000);if(ui.view==='zal')renderLog('append')}

function startSession(n,o){
  const pc=S.pcs[n-1],t=tariff(o.tariffId),now=Date.now();
  const rate=t.type==='hour'?t.price:Math.round(t.price/(t.minutes/60));
  const s={id:uid(),start:now,mode:o.mode,tariffId:t.id,tname:t.name,rate,clientId:o.clientId||null,guest:o.guest||'',
    pausedTotal:0,pausedAt:null,bar:[],note:o.note||'',paid:0,paidMin:0};
  if(o.mode==='pre'){
    s.paidMin=t.type==='package'?t.minutes:o.minutes;
    s.paid=t.type==='package'?t.price:o.amount;
    led('pc',s.paid,o.method,{pc:n,clientId:s.clientId});
  }
  pc.status='busy';pc.session=s;
  const L=limitMs(s);
  addLog('info',`Seans boshlandi PC ${n} >> (${dstr(now)} ${hms(now)}${L!=null?' – '+hms(now+L):''}) ${MODES[s.mode]} / ${t.name} / ${who(s)}`+
    (o.mode==='pre'?` / Toʻlandi ${som(s.paid)} (${METHODS[o.method]})`:'')+(o.mode==='balance'?` / Balans ${som(client(s.clientId).balance)}`:''));
}
function finishSession(n,method,auto){
  const pc=S.pcs[n-1],s=pc.session,now=Date.now();
  const mins=Math.max(1,Math.ceil(elapsed(s,now)/MIN));
  let pcCost=s.mode==='pre'?s.paid:r100(s.rate*mins/60);
  const bt=barTotal(s);
  if(s.mode==='balance'){
    const c=client(s.clientId);const take=Math.min(pcCost,c?c.balance:0);
    if(c)c.balance-=take;pcCost=take;led('pc',take,'balance',{pc:n,clientId:s.clientId});
  }
  const due=(s.mode==='post'?pcCost:0)+bt;
  const m=due>0?method:'none';
  if(s.mode==='post')led('pc',pcCost,m,{pc:n,clientId:s.clientId});
  s.bar.forEach(b=>led('bar',b.price*b.qty,m,{pid:b.pid,qty:b.qty,cost:b.cost*b.qty,pc:n,clientId:s.clientId}));
  if(m==='debt')S.debts.push({id:uid(),clientId:s.clientId,name:who(s),amount:due,paid:0,t:now,note:`PC ${n} seansi`+(auto?' (vaqt tugadi, avtomatik)':''),pays:[]});
  S.history.push({id:uid(),pc:n,clientId:s.clientId,start:s.start,end:now,minutes:mins,pcCost,barCost:bt,total:pcCost+bt,method:m,mode:s.mode});
  pc.status='free';pc.session=null;
  const tail=due>0?(m==='debt'?`Qarz daftariga yozildi ${som(due)}`:`Mijozdan olindi ${som(due)} (${METHODS[m]})`):'Qoʻshimcha toʻlov yoʻq';
  addLog(due>0?'warn':'info',`Seans yakunlandi PC ${n} >> ${dstr(now)} ${hms(now)} / ${s.tname} / ${who(s)} / ${som(pcCost+bt)} / ${durTxt(mins)} / ${tail}`+(auto?' / avtomatik':''));
}

/* =================== Statistika =================== */
const INFLOW=m=>m in METHODS;
function shiftStats(from,to){
  const r={m:{cash:0,card:0,click:0,payme:0},pc:0,bar:0,topup:0,debtpay:0,debt:0,total:0,sessions:0};
  for(const e of S.ledger){if(e.t<from||e.t>=to)continue;
    if(INFLOW(e.method)){r.m[e.method]+=e.amount;r.total+=e.amount}
    if(e.kind==='pc')r.pc+=e.amount;else if(e.kind==='bar')r.bar+=e.amount;else if(e.kind==='topup')r.topup+=e.amount;else if(e.kind==='debtpay')r.debtpay+=e.amount;
    if(e.method==='debt')r.debt+=e.amount;}
  for(const h of S.history)if(h.end>=from&&h.end<to)r.sessions++;
  return r;
}
function spentMap(){const m={};for(const h of S.history)if(h.clientId)m[h.clientId]=(m[h.clientId]||0)+h.total;return m}
function levelOf(sp){let l=LEVELS[0];for(const x of LEVELS)if(sp>=x.min)l=x;return l}
function debtLeft(d){return d.amount-d.paid}
function openDebts(){return S.debts.filter(d=>debtLeft(d)>0)}

function toast(msg,kind){const t=document.createElement('div');t.className='toast'+(kind==='err'?' err':'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),kind==='err'?4200:2600)}
const modals=[];
function modal({title,body,wide,actions,onMount}){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="dlg${wide?' wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dlg-h"><h3>${esc(title)}</h3><button class="x" type="button" data-x aria-label="Yopish">×</button></div><div class="dlg-b">${body}</div><div class="dlg-f"></div></div>`;
  const f=$('.dlg-f',ov);
  const close=()=>{ov.remove();const i=modals.indexOf(close);if(i>=0)modals.splice(i,1)};
  (actions||[{label:'Yopish'}]).forEach(a=>{const b=document.createElement('button');b.type='button';b.className='btn '+(a.cls||'');b.textContent=a.label;if(a.id)b.id=a.id;
    b.onclick=()=>{if(a.run&&a.run(ov)===false)return;close()};f.appendChild(b)});
  ov.addEventListener('mousedown',e=>{if(e.target===ov)close()});
  $('[data-x]',ov).onclick=close;
  document.body.appendChild(ov);modals.push(close);
  if(onMount)onMount(ov,close);
  const first=$('input:not([disabled]),select,textarea',ov);if(first)first.focus();
  return {ov,close};
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modals.length)modals[modals.length-1]()});

function updateToolbar(){

function zalAction(a){
  const sel=selPcs();if(!sel.length)return toast('Avval jadvaldan kompyuterni tanlang','err');
  const one=sel[0];
  if(a==='start')return startModal(one.n);
  if(a==='stop'){if(sel.length>1)return stopMany(sel);return stopModal(one.n)}
  if(a==='add')return addTimeModal(one.n);
  if(a==='move')return moveModal(one.n);
  if(a==='bar')return barSellModal(one.n);
  if(a==='msg')return msgModal(sel.filter(p=>p.status!=='off'));
  if(a==='pause'){const s=one.session,now=Date.now();
    if(one.status==='busy'){one.status='pause';s.pausedAt=now;addLog('info',`Seans pauza qilindi PC ${one.n} / ${who(s)}`)}
    else{s.pausedTotal+=now-s.pausedAt;s.pausedAt=null;one.status='busy';addLog('info',`Seans davom ettirildi PC ${one.n} / ${who(s)}`)}
    return commit()}
  if(a==='restart'){const l=sel.filter(p=>p.status!=='off');addLog('info',`Qayta yuklash buyrugʻi yuborildi → ${l.map(p=>'PC '+p.n).join(', ')}`);toast(`${l.length} ta kompyuter qayta yuklanmoqda`);return commit()}
  if(a==='shutdown'){const l=sel.filter(p=>p.status==='free');const skip=sel.length-l.length;
    l.forEach(p=>p.status='off');if(l.length)addLog('info',`Oʻchirildi → ${l.map(p=>'PC '+p.n).join(', ')}`);
    if(skip)toast(`${skip} ta kompyuterda seans ochiq — avval seansni yakunlang`,'err');return commit()}
  if(a==='wake'){const l=sel.filter(p=>p.status==='off');l.forEach(p=>p.status='free');addLog('info',`Yoqildi → ${l.map(p=>'PC '+p.n).join(', ')}`);return commit()}
}

/* ---------- Stop ---------- */
function stopModal(n){
  const p=S.pcs[n-1],s=p.session,now=Date.now();const el=elapsed(s,now);const tc=s.mode==='pre'?s.paid:timeCost(s,now);const bt=barTotal(s);
  const due=(s.mode==='post'?tc:0)+bt;
  let bal='';if(s.mode==='balance'){const c=client(s.clientId);bal=`<div class="ln"><span>Balansdan yechiladi</span><span>${som(Math.min(tc,c.balance))}</span></div>`}
  const body=`<div class="frm"><div class="sumbox">
    <div class="ln"><span>Mijoz</span><b>${esc(who(s))}</b></div>
    <div class="ln"><span>Tarif · toʻlov turi</span><span>${esc(s.tname)} · ${MODES[s.mode]}</span></div>
    <div class="ln"><span>Boshlandi</span><span>${hms(s.start)}</span></div>
    <div class="ln"><span>Oʻynaldi</span><span>${durTxt(Math.ceil(el/MIN))}</span></div>
    <div class="ln"><span>Kompyuter vaqti</span><span>${som(tc)}${s.mode==='pre'?' (oldindan toʻlangan)':''}</span></div>${bal}
    ${s.bar.map(b=>`<div class="ln muted"><span>${esc(prod(b.pid)?prod(b.pid).name:'Mahsulot')} × ${b.qty}</span><span>${som(b.price*b.qty)}</span></div>`).join('')}
    <div class="ln big"><span>Toʻlash kerak</span><span>${som(due)}</span></div></div>
    ${due>0?`<label>Toʻlov usuli<select id="sp-m">${methodOpts('cash')}</select></label>`:'<div class="note">Mijoz hammasini oldindan toʻlagan — qoʻshimcha toʻlov yoʻq.</div>'}</div>`;
  const acts=[{label:'Bekor qilish'}];
  if(due>0)acts.push({label:'Qarzga yozish',cls:'dng',run:()=>{finishSession(n,'debt');commit();toast(`${who(s)}: ${som(due)} qarz daftariga yozildi`)}});
  acts.push({label:due>0?'Toʻlandi, yakunlash':'Seansni yakunlash',cls:'pri',run:()=>{finishSession(n,due>0?v('sp-m'):'none');commit();toast(`PC ${n}: seans yakunlandi`)}});
  modal({title:`Seansni yakunlash — PC ${n}`,body,actions:acts});
}
function stopMany(sel){
  const now=Date.now();const rows=sel.map(p=>{const s=p.session;return {n:p.n,s,due:(s.mode==='post'?timeCost(s,now):0)+barTotal(s)}});
  const tot=rows.reduce((a,r)=>a+r.due,0);
  modal({title:`${sel.length} ta seansni yakunlash`,body:`<div class="frm"><div class="sumbox">${rows.map(r=>`<div class="ln"><span>PC ${r.n} · ${esc(who(r.s))}</span><span>${som(r.due)}</span></div>`).join('')}<div class="ln big"><span>Jami</span><span>${som(tot)}</span></div></div>
    <label>Toʻlov usuli<select id="sm-m">${methodOpts('cash')}</select></label></div>`,
    actions:[{label:'Bekor qilish'},{label:'Toʻlandi, hammasini yakunlash',cls:'pri',run:()=>{const m=v('sm-m');rows.forEach(r=>finishSession(r.n,m));commit();toast(`${rows.length} ta seans yakunlandi`)}}]});
}
/* ---------- Qoʻshimcha vaqt ---------- */
function addTimeModal(n){
  const s=S.pcs[n-1].session;
  if(s.mode==='post')return toast('Keyin toʻlov seansida vaqt cheklanmagan — qoʻshimcha toʻlov kerak emas');
  if(s.mode==='balance')return topupModal(s.clientId);
  modal({title:`Vaqt qoʻshish — PC ${n}`,body:`<div class="frm"><div class="row2"><label>Daqiqa<input id="ad-min" type="number" min="1" step="15" value="60"></label><label>Summa<input id="ad-amt" type="number" min="0" step="1000"></label></div>
    <div class="qk">${[30,60,120].map(x=>`<button type="button" class="btn sm" data-qm="${x}">+${durTxt(x)}</button>`).join('')}</div>
    <label>Toʻlov usuli<select id="ad-m">${methodOpts('cash')}</select></label><div class="note">Soatiga ${som(s.rate)} · hozir qolgan: ${durS(limitMs(s)-elapsed(s))}</div></div>`,
    actions:[{label:'Bekor qilish'},{label:'Qoʻshish',cls:'pri',run:()=>{const m=vn('ad-min'),a=vn('ad-amt');if(!m)return false;
      s.paidMin+=m;s.paid+=a;led('pc',a,v('ad-m'),{pc:n,clientId:s.clientId});addLog('info',`Vaqt qoʻshildi PC ${n} +${durTxt(m)} / ${som(a)} (${METHODS[v('ad-m')]}) / ${who(s)}`);commit();toast(`PC ${n}: +${durTxt(m)}`)}}],
    onMount:ov=>{let src='min';const upd=()=>{if(src==='min')$('#ad-amt').value=r100(s.rate*vn('ad-min')/60);else $('#ad-min').value=Math.floor(vn('ad-amt')/s.rate*60)};
      $('#ad-min').oninput=()=>{src='min';upd()};$('#ad-amt').oninput=()=>{src='amt';upd()};$$('[data-qm]',ov).forEach(b=>b.onclick=()=>{src='min';$('#ad-min').value=b.dataset.qm;upd()});upd()}});
}
function moveModal(n){
  const free=S.pcs.filter(p=>p.status==='free');if(!free.length)return toast('Boʻsh kompyuter yoʻq','err');
  modal({title:`Seansni koʻchirish — PC ${n}`,body:`<div class="frm"><label>Qaysi kompyuterga<select id="mv-t">${free.map(p=>`<option value="${p.n}">PC ${p.n}</option>`).join('')}</select></label><div class="note">Vaqt, toʻlov va bar hisobi yangi kompyuterga oʻtadi.</div></div>`,
    actions:[{label:'Bekor qilish'},{label:'Koʻchirish',cls:'pri',run:()=>{const to=+v('mv-t'),a=S.pcs[n-1],b=S.pcs[to-1];b.session=a.session;b.status=a.status;a.session=null;a.status='free';
      addLog('info',`Seans koʻchirildi PC ${n} → PC ${to} / ${who(b.session)}`);ui.sel=new Set([to]);commit();toast(`PC ${n} → PC ${to}`)}}]});

function msgModal(list){

/* ---------- Jurnal ---------- */
function filteredLog(){const q=ui.logQ.trim().toLowerCase();return S.log.filter(l=>(ui.logF==='all'||l.type===ui.logF)&&(!q||l.text.toLowerCase().includes(q)))}
function renderLog(mode){
  const box=$('#log');if(!box)return;
  const atBottom=box.scrollTop+box.clientHeight>=box.scrollHeight-10;const prevH=box.scrollHeight,prevT=box.scrollTop;
  const list=filteredLog(),shown=list.slice(-ui.logLimit),more=list.length-shown.length;
  box.innerHTML=`<div class="lgmore">${more>0?`↑ Yuqoriga suring — yana ${more} ta eski xabar`:'Jurnal boshi'}</div>`+
    shown.map(l=>{const k=l.t+'|'+l.text.length;return `<div class="lg lg-${l.type}${ui.logSel===k?' sel':''}" data-k="${k}">${LOGI[l.type]||LOGI.info}<span class="lt">${dshort(l.t)} ${hms(l.t)}</span><span>${esc(l.text)}</span></div>`}).join('');
  $('#lgc').textContent=`${list.length} ta yozuv`;
  if(mode==='keep')box.scrollTop=box.scrollHeight-prevH+prevT;
  else if(mode==='bottom'||atBottom)box.scrollTop=box.scrollHeight;
  else box.scrollTop=prevT;
}

/* =================== BAR =================== */
function barSellModal(pcN){
  const ps=S.products.filter(p=>p.stock>0);if(!ps.length)return toast('Omborda mahsulot qolmagan','err');
  const act=S.pcs.filter(active);
  modal({title:'Bar: sotish',body:`<div class="frm">
    <label>Mahsulot<select id="bs-p">${ps.map(p=>`<option value="${p.id}">${esc(p.name)} — ${som(p.price)} (qoldiq ${p.stock})</option>`).join('')}</select></label>
    <div class="row2"><label>Soni<input id="bs-q" type="number" min="1" value="1"></label>
    <label>Qayerga<select id="bs-d">${act.map(p=>`<option value="${p.n}"${p.n===pcN?' selected':''}>PC ${p.n} seansi hisobiga · ${esc(who(p.session))}</option>`).join('')}<option value="0"${pcN?'':' selected'}>Darhol toʻlov (seanssiz)</option></select></label></div>
    <label id="bs-mw">Toʻlov usuli<select id="bs-m">${methodOpts('cash')}</select></label>
    <div class="sumbox" id="bs-s"></div><div class="err" id="bs-e"></div></div>`,
    actions:[{label:'Bekor qilish'},{label:'Sotish',cls:'pri',run:()=>{
      const p=prod(v('bs-p')),q=vn('bs-q'),d=+v('bs-d');if(!q)return false;if(q>p.stock)return $('#bs-e').textContent=`Omborda faqat ${p.stock} ta qolgan`,false;
      p.stock-=q;
      if(d){const s=S.pcs[d-1].session;s.bar.push({pid:p.id,qty:q,price:p.price,cost:p.cost,t:Date.now()});addLog('info',`Bar: ${p.name}, soni=${q}, summa=${som(p.price*q)} seans hisobiga PC ${d} / ${who(s)}`)}
      else{led('bar',p.price*q,v('bs-m'),{pid:p.id,qty:q,cost:p.cost*q});addLog('info',`Bar: ${p.name}, soni=${q}, summa=${som(p.price*q)} / toʻlandi (${METHODS[v('bs-m')]})`)}
      if(p.stock<=p.min)addLog('warn',`Omborda kam qoldi: ${p.name} — ${p.stock} ta`);
      commit();toast(`${p.name} × ${q} sotildi`)}}],
    onMount:ov=>{const upd=()=>{const p=prod(v('bs-p'));$('#bs-mw').hidden=v('bs-d')!=='0';$('#bs-s').innerHTML=`<div class="ln big"><span>Summa</span><span>${som(p.price*vn('bs-q'))}</span></div>`;$('#bs-e').textContent=''};ov.addEventListener('input',upd);ov.addEventListener('change',upd);upd()}});
}

function vBar(m){

  const pend=S.pcs.filter(p=>p.session&&p.session.bar.length).reduce((a,p)=>a+barTotal(p.session),0);

  m.innerHTML=`<div class="page"><div class="ph"><h1>Bar</h1><button class="btn" type="button" id="b-sell">Sotish</button>${isAdmin()?'<button class="btn pri" type="button" id="b-new">Yangi mahsulot</button>':''}</div>

    <div class="kpi"><div class="l">Ochiq seanslar hisobida</div><div class="v">${som(pend)}</div><div class="s">seans yakunida toʻlanadi</div></div>
    <div class="kpi ${low.length?'bad':''}"><div class="l">Kam qolgan mahsulot</div><div class="v">${low.length}</div><div class="s">${low.map(p=>esc(p.name)).join(', ')||'hammasi yetarli'}</div></div>

  <div class="box"><h2>Ichimliklar <small>Ogohlantirish chegarasiga yetganlari qizil bilan belgilanadi</small></h2><div class="tbl"><table class="t"><thead><tr><th>Mahsulot</th><th class="r">Narx</th><th class="r">Tannarx</th><th class="r">Ustama</th><th class="r">Qoldiq</th><th></th></tr></thead><tbody>
  ${S.products.map(p=>`<tr><td>${esc(p.name)}</td><td class="r">${som(p.price)}</td><td class="r muted">${som(p.cost)}</td><td class="r">${p.cost?Math.round((p.price-p.cost)/p.cost*100)+'%':'—'}</td>
    <td class="r">${p.stock<=p.min?`<span class="pill p-off">${p.stock} ta</span>`:p.stock+' ta'}</td>
    <td class="act"><button class="btn sm" type="button" data-sell="${p.id}"${p.stock?'':' disabled'}>Sotish</button><button class="btn sm" type="button" data-in="${p.id}">Kirim</button>${isAdmin()?`<button class="btn sm" type="button" data-ed="${p.id}">Tahrirlash</button><button class="btn sm dng" type="button" data-del="${p.id}">Oʻchirish</button>`:''}</td></tr>`).join('')}
  </tbody></table></div></div>
  <div class="box"><h2>Bugungi sotuvlar</h2><div class="tbl">${sales.length?`<table class="t"><thead><tr><th>Vaqt</th><th>Mahsulot</th><th class="r">Soni</th><th class="r">Summa</th><th>Qayerda</th><th>Toʻlov</th></tr></thead><tbody>
    ${sales.slice(-25).reverse().map(e=>`<tr><td>${hm(e.t)}</td><td>${esc(prod(e.pid)?prod(e.pid).name:'—')}</td><td class="r">${e.qty||1}</td><td class="r">${som(e.amount)}</td><td>${e.pc?'PC '+e.pc:'Bar peshtaxtasi'}</td><td>${METHODS[e.method]||(e.method==='debt'?'Qarz':'—')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Bugun hali sotuv boʻlmadi</div>'}</div></div></div>`;
  $('#b-sell').onclick=()=>barSellModal(null);

  const c=id?client(id):{name:'',phone:'+998 ',login:'',pass:''};
  modal({title:id?'Mijozni tahrirlash':'Yangi mijoz',body:`<div class="frm"><label>Ism familiya<input id="cl-n" value="${esc(c.name)}"></label><label>Telefon<input id="cl-p" value="${esc(c.phone)}" inputmode="tel"></label>
    <div class="row2"><label>Login (kompyuterga kirish uchun)<input id="cl-l" value="${esc(c.login)}" autocomplete="off"></label><label>Parol<input id="cl-s" value="${esc(c.pass)}" autocomplete="off"></label></div>
    <div class="note">Mijoz istalgan kompyuterda shu login va parol bilan kiradi, oʻyin vaqti balansidan yechiladi.</div><div class="err" id="cl-e"></div></div>`,

function vClients(m){

/* =================== HISOBOT =================== */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function stackChart(rows,colors,fmtY){
  const W=1000,H=250,pl=62,pr=8,pt=12,pb=26,iw=W-pl-pr,ih=H-pt-pb;
  const max=niceMax(Math.max(1,...rows.map(r=>r.vals.reduce((a,b)=>a+b,0))));
  const bw=iw/rows.length,step=Math.ceil(rows.length/12);
  let g='';for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-8}" y="${y+4}" text-anchor="end">${fmtY(max*i/4)}</text>`}
  rows.forEach((r,i)=>{let y=pt+ih;const x=pl+i*bw+bw*.16,w=bw*.68;
    r.vals.forEach((v,j)=>{const h=v/max*ih;if(h>0){y-=h;g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${colors[j]}" rx="1.5"><title>${esc(r.label)}: ${r.vals.map(som).join(' + ')}</title></rect>`}});
    if(i%step===0)g+=`<text x="${(pl+i*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(r.label)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tushum grafigi">${g}</svg>`;
}
function vReport(m){
  const now=Date.now(),P=ui.rep,from=sod(now)-(P-1)*DAY;
  const L=S.ledger.filter(e=>e.t>=from),H=S.history.filter(h=>h.end>=from);
  const pc=L.filter(e=>e.kind==='pc').reduce((a,e)=>a+e.amount,0),bar=L.filter(e=>e.kind==='bar').reduce((a,e)=>a+e.amount,0);
  const mins=H.reduce((a,h)=>a+h.minutes,0),occ=mins/(PCS*(now-from)/MIN)*100;
  const newDebt=S.debts.filter(d=>d.t>=from).reduce((a,d)=>a+d.amount,0);
  // tushum grafigi
  let rows=[];
  if(P===1){for(let h=0;h<=new Date(now).getHours();h++){const a=from+h*3600e3,b=a+3600e3;const f=L.filter(e=>e.t>=a&&e.t<b);rows.push({label:p2(h),vals:[f.filter(e=>e.kind==='pc').reduce((x,e)=>x+e.amount,0),f.filter(e=>e.kind==='bar').reduce((x,e)=>x+e.amount,0)]})}}
  else for(let d=0;d<P;d++){const a=from+d*DAY,b=a+DAY;const f=L.filter(e=>e.t>=a&&e.t<b);rows.push({label:P>7?String(new Date(a).getDate()):WD[new Date(a).getDay()]+' '+new Date(a).getDate(),vals:[f.filter(e=>e.kind==='pc').reduce((x,e)=>x+e.amount,0),f.filter(e=>e.kind==='bar').reduce((x,e)=>x+e.amount,0)]})}
  // soatlar boʻyicha bandlik
  const hb=new Array(24).fill(0);H.forEach(h=>{for(let t=h.start;t<h.end;t+=15*MIN)hb[new Date(t).getHours()]+=15});
  const hrows=hb.map((x,i)=>({label:p2(i),vals:[x/(P*60)/PCS*100]}));
  // top mijozlar va ichimliklar
  const tc={};H.forEach(h=>{if(h.clientId)tc[h.clientId]=(tc[h.clientId]||0)+h.total});
  const top=Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const tp={};L.filter(e=>e.kind==='bar').forEach(e=>{tp[e.pid]=tp[e.pid]||{q:0,a:0};tp[e.pid].q+=e.qty||1;tp[e.pid].a+=e.amount});
  const topP=Object.entries(tp).sort((a,b)=>b[1].a-a[1].a).slice(0,6);
  const mm={cash:0,card:0,click:0,payme:0};L.forEach(e=>{if(INFLOW(e.method))mm[e.method]+=e.amount});const mt=Object.values(mm).reduce((a,b)=>a+b,0)||1;
  const mc={cash:'var(--c4)',card:'var(--c1)',click:'var(--c3)',payme:'var(--c2)'};
  const hbar=(l,val,max,txt)=>`<div class="hbar"><span class="nm">${l}</span><span class="tr"><i style="width:${(val/max*100).toFixed(1)}%"></i></span><span class="num">${txt}</span></div>`;
  m.innerHTML=`<div class="page"><div class="ph"><h1>Hisobot</h1><div class="tabs">${[[1,'Bugun'],[7,'7 kun'],[30,'30 kun']].map(([k,l])=>`<button type="button" data-rp="${k}" class="${P===k?'on':''}">${l}</button>`).join('')}</div></div>
    <div class="kpis"><div class="kpi"><div class="l">Jami tushum</div><div class="v">${som(pc+bar)}</div><div class="s">${dshort(from)} – ${dshort(now)}</div></div>
      <div class="kpi"><div class="l">Kompyuter vaqti</div><div class="v">${som(pc)}</div><div class="s">${Math.round(mins/60)} soat oʻynaldi</div></div>
      <div class="kpi"><div class="l">Bar</div><div class="v">${som(bar)}</div><div class="s">${Object.values(tp).reduce((a,x)=>a+x.q,0)} dona</div></div>
      <div class="kpi"><div class="l">Seanslar</div><div class="v">${H.length}</div><div class="s">oʻrtacha ${H.length?durTxt(mins/H.length):'—'}</div></div>
      <div class="kpi"><div class="l">Oʻrtacha bandlik</div><div class="v">${occ.toFixed(1)}%</div><div class="s">${PCS} ta kompyuterdan</div></div>
      <div class="kpi bad"><div class="l">Qarzga berildi</div><div class="v">${som(newDebt)}</div></div></div>
    <div class="box"><h2>${P===1?'Soatlar boʻyicha tushum':'Kunlik tushum'}<small><span class="legend" style="margin:0"><span><i style="background:var(--c1)"></i>Kompyuter</span><span><i style="background:var(--c2)"></i>Bar</span></span></small></h2><div class="boxb">${stackChart(rows,['var(--c1)','var(--c2)'],compact)}</div></div>
    <div class="box"><h2>Soatlar boʻyicha oʻrtacha bandlik<small>qaysi soatlarda zal toʻla</small></h2><div class="boxb">${stackChart(hrows,['var(--c3)'],x=>Math.round(x)+'%')}</div></div>
    <div class="cols"><div class="box"><h2>Eng faol mijozlar</h2><div class="boxb">${top.length?top.map(([id,a])=>hbar(esc(client(id)?client(id).name:'—'),a,top[0][1],num(a))).join(''):'<div class="empty">Maʼlumot yoʻq</div>'}</div></div>
      <div class="box"><h2>Eng koʻp sotilgan ichimliklar</h2><div class="boxb">${topP.length?topP.map(([id,x])=>hbar(esc(prod(id)?prod(id).name:'—'),x.a,topP[0][1].a,`${x.q} ta · ${num(x.a)}`)).join(''):'<div class="empty">Maʼlumot yoʻq</div>'}</div></div>
      <div class="box"><h2>Toʻlov usullari</h2><div class="boxb"><div class="split">${Object.keys(mm).map(k=>`<i style="width:${(mm[k]/mt*100).toFixed(2)}%;background:${mc[k]}" title="${METHODS[k]}"></i>`).join('')}</div>
        <div class="legend">${Object.keys(mm).map(k=>`<span><i style="background:${mc[k]}"></i>${METHODS[k]} · ${num(mm[k])} (${Math.round(mm[k]/mt*100)}%)</span>`).join('')}</div></div></div></div>
    <div class="note">Oʻtgan kunlar uchun raqamlar namuna maʼlumot — dastur ishlagani sari haqiqiy seanslar bilan almashadi.</div></div>`;
  $$('[data-rp]',m).forEach(b=>b.onclick=()=>{ui.rep=+b.dataset.rp;vReport(m)});
}

/* =================== FOYDA =================== */
function expenseModal(){
  modal({title:'Xarajat qoʻshish',body:`<div class="frm"><div class="row2"><label>Turi<select id="ex-c">${EXP_CATS.map(c=>`<option>${c}</option>`).join('')}</select></label><label>Summa (soʻm)<input id="ex-a" type="number" min="1" step="1000"></label></div>
    <div class="row2"><label>Sana<input id="ex-d" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Izoh<input id="ex-n" placeholder="Ixtiyoriy"></label></div><div class="err" id="ex-e"></div></div>`,
    actions:[{label:'Bekor qilish'},{label:'Qoʻshish',cls:'pri',run:()=>{const a=vn('ex-a');if(!a)return $('#ex-e').textContent='Summani kiriting',false;
      const t=new Date(v('ex-d')+'T12:00').getTime()||Date.now();S.expenses.push({id:uid(),t,cat:v('ex-c'),amount:a,note:v('ex-n').trim()});ui.pm=ymKey(t);commit();toast('Xarajat qoʻshildi')}}]});
}
function vProfit(m){
  if(!isAdmin())return vReport(m);
  const months=[...new Set([...S.ledger.map(e=>ymKey(e.t)),...S.expenses.map(e=>ymKey(e.t))])].sort().reverse();
  if(!ui.pm||!months.includes(ui.pm))ui.pm=months[0]||ymKey(Date.now());
  const k=ui.pm,L=S.ledger.filter(e=>ymKey(e.t)===k),E=S.expenses.filter(e=>ymKey(e.t)===k).sort((a,b)=>a.t-b.t);
  const pc=L.filter(e=>e.kind==='pc').reduce((a,e)=>a+e.amount,0),bar=L.filter(e=>e.kind==='bar').reduce((a,e)=>a+e.amount,0),cogs=L.filter(e=>e.kind==='bar').reduce((a,e)=>a+(e.cost||0),0);
  const byCat={};E.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+e.amount);const exp=E.reduce((a,e)=>a+e.amount,0);
  const rev=pc+bar,gross=rev-cogs,net=gross-exp;
  const [y,mo]=k.split('-').map(Number);
  m.innerHTML=`<div class="page"><div class="ph"><h1>Foyda hisob-kitobi</h1><select id="pm" class="btn" aria-label="Oy">${months.map(x=>{const[a,b]=x.split('-').map(Number);return `<option value="${x}"${x===k?' selected':''}>${MONL[b-1]} ${a}</option>`}).join('')}</select><button class="btn pri" type="button" id="ex-new">Xarajat qoʻshish</button></div>
    <div class="kpis"><div class="kpi"><div class="l">Tushum</div><div class="v">${som(rev)}</div><div class="s">kompyuter ${compact(pc)} · bar ${compact(bar)}</div></div>
      <div class="kpi"><div class="l">Bar tannarxi</div><div class="v">${som(cogs)}</div><div class="s">bar ustamasi ${som(bar-cogs)}</div></div>
      <div class="kpi"><div class="l">Xarajatlar</div><div class="v">${som(exp)}</div><div class="s">${E.length} ta yozuv</div></div>
      <div class="kpi ${net>=0?'good':'bad'}"><div class="l">Sof foyda</div><div class="v">${som(net)}</div><div class="s">rentabellik ${rev?Math.round(net/rev*100):0}%</div></div></div>
    <div class="cols"><div class="box"><h2>${MONL[mo-1]} ${y}: foyda va zarar</h2><div class="tbl"><table class="t pl"><tbody>
      <tr class="sub"><td style="padding-left:12px">Tushum</td><td class="r">${som(rev)}</td></tr><tr><td>Kompyuter vaqti</td><td class="r">${som(pc)}</td></tr><tr><td>Bar sotuvi</td><td class="r">${som(bar)}</td></tr>
      <tr><td>Bar tannarxi</td><td class="r">−${som(cogs)}</td></tr><tr class="sub"><td style="padding-left:12px">Yalpi foyda</td><td class="r">${som(gross)}</td></tr>
      ${EXP_CATS.filter(c=>byCat[c]).map(c=>`<tr><td>${c}</td><td class="r">−${som(byCat[c])}</td></tr>`).join('')}
      <tr class="tot"><td style="padding-left:12px">Sof foyda</td><td class="r" style="color:${net>=0?'var(--ok)':'var(--off)'}">${som(net)}</td></tr></tbody></table></div></div>
    <div class="box"><h2>Xarajatlar roʻyxati</h2><div class="tbl">${E.length?`<table class="t"><thead><tr><th>Sana</th><th>Turi</th><th>Izoh</th><th class="r">Summa</th><th></th></tr></thead><tbody>${E.map(e=>`<tr><td>${dshort(e.t)}</td><td>${e.cat}</td><td class="muted">${esc(e.note)}</td><td class="r">${som(e.amount)}</td><td class="act"><button class="btn sm dng" type="button" data-xd="${e.id}" aria-label="Oʻchirish">×</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Bu oyda xarajat kiritilmagan</div>'}</div></div></div>
    <div class="note">Tushum kompyuter va bar sotuvidan hisoblanadi (balansdan yechilgan va qarzga berilgan summalar ham kiradi). Balans toʻldirish tushum emas — u mijozning oldindan toʻlovi.</div></div>`;
  $('#pm').onchange=e=>{ui.pm=e.target.value;vProfit(m)};$('#ex-new').onclick=expenseModal;
  $$('[data-xd]',m).forEach(b=>b.onclick=()=>confirmM('Xarajatni oʻchirish','Bu xarajat yozuvi oʻchirilsinmi?',()=>{S.expenses=S.expenses.filter(e=>e.id!==b.dataset.xd);commit()},'Oʻchirish'));
}

/* =================== TARIFLAR =================== */
function tariffModal(id){
  const t=id?tariff(id):{name:'',type:'hour',price:'',minutes:180,days:[0,1,2,3,4,5,6],from:'',to:'',active:true};
  modal({title:id?'Tarifni tahrirlash':'Yangi tarif',body:`<div class="frm"><div class="row2"><label>Nomi<input id="tf-n" value="${esc(t.name)}" placeholder="Masalan: VIP, Tungi paket"></label>
    <label>Turi<select id="tf-t"><option value="hour"${t.type==='hour'?' selected':''}>Soatbay</option><option value="package"${t.type==='package'?' selected':''}>Paket (belgilangan vaqt)</option></select></label></div>
    <div class="row2"><label id="tf-pl">Narx (soʻm)<input id="tf-p" type="number" min="0" step="500" value="${t.price||''}"></label><label id="tf-mw">Davomiylik (daqiqa)<input id="tf-m" type="number" min="15" step="15" value="${t.minutes||180}"></label></div>
    <label>Hafta kunlari<div class="days">${[1,2,3,4,5,6,0].map(d=>`<label><input type="checkbox" data-day="${d}"${t.days.includes(d)?' checked':''}>${WD[d]}</label>`).join('')}</div></label>
    <div class="row2"><label>Amal qilish vaqti: dan<input id="tf-f" type="time" value="${t.from}"></label><label>gacha<input id="tf-to" type="time" value="${t.to}"></label></div>
    <label class="ck"><input type="checkbox" id="tf-a"${t.active?' checked':''}>Faol</label><div class="note">Vaqt boʻsh qolsa — kun boʻyi amal qiladi. Tungi oraliq (22:00 – 08:00) ham ishlaydi.</div><div class="err" id="tf-e"></div></div>`,
    actions:[{label:'Bekor qilish'},{label:'Saqlash',cls:'pri',run:(ov)=>{const n=v('tf-n').trim();if(!n)return $('#tf-e').textContent='Nomini kiriting',false;
      const o={name:n,type:v('tf-t'),price:vn('tf-p'),minutes:vn('tf-m'),days:$$('[data-day]',ov).filter(x=>x.checked).map(x=>+x.dataset.day),from:v('tf-f'),to:v('tf-to'),active:$('#tf-a').checked};
      if(!o.days.length)return $('#tf-e').textContent='Kamida bitta kun tanlang',false;
      if(id)Object.assign(t,o);else S.tariffs.push(Object.assign({id:'t'+uid()},o));commit();toast('Tarif saqlandi')}}],
    onMount:ov=>{const u=()=>{const pk=v('tf-t')==='package';$('#tf-mw').hidden=!pk;$('#tf-pl').firstChild.textContent=pk?'Paket narxi (soʻm)':'Soatiga narx (soʻm)'};ov.addEventListener('change',u);u()}});
}
function vTariffs(m){
  const adm=isAdmin(),now=new Date();
  m.innerHTML=`<div class="page"><div class="ph"><h1>Tariflar</h1>${adm?'<button class="btn pri" type="button" id="tf-new">Yangi tarif</button>':''}</div>
    <div class="box"><div class="tbl"><table class="t"><thead><tr><th>Tarif</th><th>Turi</th><th class="r">Narx</th><th>Davomiylik</th><th>Kunlar</th><th>Vaqt</th><th>Holat</th><th></th></tr></thead><tbody>
    ${S.tariffs.map(t=>`<tr><td><b>${esc(t.name)}</b></td><td>${t.type==='hour'?'Soatbay':'Paket'}</td><td class="r">${t.price?som(t.price)+(t.type==='hour'?' / soat':''):'<span class="pill p-pause">Narx kiritilmagan</span>'}</td>
      <td>${t.type==='package'?durTxt(t.minutes):'—'}</td><td>${t.days.length===7?'Har kuni':[1,2,3,4,5,6,0].filter(d=>t.days.includes(d)).map(d=>WD[d]).join(', ')}</td><td>${t.from&&t.to?t.from+' – '+t.to:'Kun boʻyi'}</td>
      <td>${!t.active?'<span class="pill p-mut">Oʻchirilgan</span>':applies(t,now)?'<span class="pill p-free">Hozir amal qiladi</span>':'<span class="pill p-mut">Hozir emas</span>'}</td>
      <td class="act">${adm?`<button class="btn sm" type="button" data-te="${t.id}">Tahrirlash</button><button class="btn sm dng" type="button" data-tx="${t.id}">Oʻchirish</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="note">Narxi kiritilmagan yoki hozirgi vaqtga toʻgʻri kelmaydigan tariflar Start oynasida tanlab boʻlmaydi. ${adm?'':'Tariflarni faqat admin oʻzgartira oladi.'}</div></div>`;
  if($('#tf-new'))$('#tf-new').onclick=()=>tariffModal(null);
  $$('[data-te]',m).forEach(b=>b.onclick=()=>tariffModal(b.dataset.te));
  $$('[data-tx]',m).forEach(b=>b.onclick=()=>{const t=tariff(b.dataset.tx);confirmM('Tarifni oʻchirish',`«${esc(t.name)}» tarifi oʻchirilsinmi? Ochiq seanslar eski narxda davom etadi.`,()=>{S.tariffs=S.tariffs.filter(x=>x!==t);commit()},'Oʻchirish')});
}

/* =================== SOZLAMALAR =================== */
function vSettings(m){
  if(!isAdmin())return vZal(m);
  const st=S.settings;
  m.innerHTML=`<div class="page"><div class="ph"><h1>Sozlamalar</h1></div>
    <div class="cols"><div class="box"><h2>Klub</h2><div class="boxb"><div class="frm">
      <label>Klub nomi<input id="se-n" value="${esc(st.name)}"></label>
      <label class="ck"><input type="checkbox" id="se-24"${st.h24?' checked':''}>24/7 ishlaydi</label>
      <div class="row2" id="se-hw"><label>Ochilish<input id="se-o" type="time" value="${st.open}"></label><label>Yopilish<input id="se-c" type="time" value="${st.close}"></label></div>
      <label>Tema<select id="se-t"><option value="system">Tizim boʻyicha</option><option value="light">Yorugʻ</option><option value="dark">Qorongʻu</option></select></label>
      <div><button class="btn pri" type="button" id="se-s">Saqlash</button></div></div></div></div>
    <div class="box"><h2>Xodimlar</h2><div class="tbl"><table class="t"><thead><tr><th>Ism</th><th>Login</th><th>Rol</th><th></th></tr></thead><tbody>
      ${S.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.login)}</td><td>${u.role==='admin'?'<span class="pill p-acc">Admin</span>':'<span class="pill p-mut">Operator</span>'}</td><td class="act"><button class="btn sm" type="button" data-pw="${u.login}">Parolni oʻzgartirish</button></td></tr>`).join('')}</tbody></table></div>
      <div class="boxb note">Operator Foyda hisob-kitobi va Sozlamalarni koʻrmaydi, tarif va mahsulotlarni oʻzgartira olmaydi.</div></div>
    <div class="box"><h2>Prototip maʼlumotlari</h2><div class="boxb"><p class="note" style="margin-top:0">Hamma maʼlumot shu brauzerda saqlanadi. Namuna maʼlumotlarni boshidan yaratish mumkin.</p><button class="btn dng" type="button" id="se-r">Namuna maʼlumotlarni qayta tiklash</button></div></div></div></div>`;
  $('#se-t').value=st.theme;
  const hw=()=>{$('#se-hw').hidden=$('#se-24').checked};$('#se-24').onchange=hw;hw();
  $('#se-s').onclick=()=>{st.name=v('se-n').trim()||'CYBER ZAL';st.h24=$('#se-24').checked;st.open=v('se-o');st.close=v('se-c');st.theme=v('se-t');applyTheme();commit();toast('Sozlamalar saqlandi')};
  $$('[data-pw]',m).forEach(b=>b.onclick=()=>{const u=S.users.find(x=>x.login===b.dataset.pw);modal({title:`${u.name}: yangi parol`,body:`<div class="frm"><label>Yangi parol<input id="pw-n" type="text" autocomplete="off"></label></div>`,
    actions:[{label:'Bekor qilish'},{label:'Saqlash',cls:'pri',run:()=>{if(!v('pw-n'))return false;u.pass=v('pw-n');save();toast('Parol oʻzgartirildi')}}]})});
  $('#se-r').onclick=()=>confirmM('Qayta tiklash','Barcha oʻzgarishlar oʻchib, namuna maʼlumotlar qaytadan yaratiladi. Davom etasizmi?',()=>{seed();S.user='admin';applyTheme();save();ui.sel.clear();commit();toast('Namuna maʼlumotlar tiklandi')},'Tiklash');
}

/* =================== Foydalanuvchini almashtirish =================== */
function loginModal(){
  modal({title:'Tizimga kirish',body:`<div class="frm"><label>Foydalanuvchi<select id="lg-u">${S.users.map(u=>`<option value="${u.login}"${u.login===S.user?' selected':''}>${esc(u.name)} (${u.role==='admin'?'admin':'operator'})</option>`).join('')}</select></label>
    <label>Parol<input id="lg-p" type="password" autocomplete="off"></label><div class="note">Prototip parollari: admin — <b>admin</b>, operator — <b>1111</b></div><div class="err" id="lg-e"></div></div>`,
    actions:[{label:'Bekor qilish'},{label:'Kirish',cls:'pri',run:()=>{const u=S.users.find(x=>x.login===v('lg-u'));if(!u||u.pass!==v('lg-p'))return $('#lg-e').textContent='Parol notoʻgʻri',false;
      S.user=u.login;addLog('info',`Tizimga kirdi: ${u.name}`);if((ui.view==='foyda'||ui.view==='sozlamalar')&&u.role!=='admin')ui.view='zal';commit();toast(`Xush kelibsiz, ${u.name}`)}}],
    onMount:ov=>$('#lg-p',ov).addEventListener('keydown',e=>{if(e.key==='Enter')$('.dlg-f .pri',ov).click()})});
}

/* =================== Ishga tushirish =================== */
S=load()||seed();
if(!S.pcs||S.pcs.length!==PCS){seed()}
applyTheme();
{const f=S.pcs.find(active);if(f){ui.sel.add(f.n);ui.last=f.n}}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b)go(b.dataset.v)});
$('#nav2').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b)go(b.dataset.v)});
$('#meBtn').onclick=loginModal;
$('#themeBtn').onclick=()=>{const cur=S.settings.theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):S.settings.theme;S.settings.theme=cur==='dark'?'light':'dark';applyTheme();save();renderNav()};
save();renderNav();render();

setInterval(()=>{
  const now=Date.now();let ch=false;
  S.pcs.forEach(p=>{const s=p.session;if(!s||p.status!=='busy')return;const L=limitMs(s);
    if(L!=null&&elapsed(s,now)>=L){finishSession(p.n,barTotal(s)>0?'debt':'none',true);ch=true}});
  if(ch){save();renderNav();if(ui.view!=='zal')render()}
  if(ui.view==='zal'){updateClock();renderGrid();updateToolbar()}
},1000);
})();
</script>
</body>
</html>
