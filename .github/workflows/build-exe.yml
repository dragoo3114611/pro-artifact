name: Windows exe

on:
  push:
    paths: ['index.html', 'admin/**', '.github/workflows/build-exe.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
        working-directory: admin
      - run: npm run dist
        working-directory: admin
      - uses: actions/upload-artifact@v4
        with:
          name: KlubPult-Server-windows
          path: admin/dist/*.exe
